name: Validate V1.7.3 Firewall Controls

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-v173:
    if: github.event.pull_request.head.ref == 'agent/v1.7.3-firewall-controls'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.7.2 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.7.2 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 19' work/hyzorax-control/internal/helper/protocol.go
          grep -q 'Version 1.7.2' work/hyzorax-control/internal/web/static/index.html
          grep -q 'func securityFirewall' work/hyzorax-control/internal/helper/security_linux.go

      - name: Apply V1.7.3 firewall patch
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.7.3/firewall_controls.py
          python3 release-patch/v1.7.3/firewall_controls.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w \
            internal/helper/security_linux.go \
            internal/helper/security_linux_test.go \
            internal/helper/security_firewall_acceptance_test.go \
            internal/helper/server_linux.go \
            internal/httpapi/security.go \
            internal/httpapi/app.go \
            internal/httpapi/app_test.go \
            internal/web/assets_test.go

      - name: Static firewall safety checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'const ProtocolVersion = 20' internal/helper/protocol.go
          grep -q 'Version 1.7.3' internal/web/static/index.html
          grep -Rqs 'security.firewall.apply' internal/helper internal/httpapi
          grep -q 'TestSecurityFirewallAcceptance' internal/helper/security_firewall_acceptance_test.go
          grep -q 'unmanaged_nft_conflict' internal/helper/security_linux.go
          grep -q 'firewall_lockout_risk' internal/helper/security_linux.go
          grep -q '"list", "ruleset"' internal/helper/security_linux.go
          if grep -RniE 'nft[^\n]*(add|delete|flush|insert|replace)' internal/helper/security_linux.go internal/httpapi/security.go; then
            echo 'Raw nftables write path detected; V1.7.3 must keep nftables read-only.' >&2
            exit 1
          fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Guarded Ubuntu 24.04 firewall acceptance
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=120 -y --no-install-recommends install ufw nftables openssh-server
          sudo mkdir -p /run/sshd /etc/hyzorax-control
          printf 'listen = "0.0.0.0:9443"\n' | sudo tee /etc/hyzorax-control/config.toml >/dev/null
          sudo systemctl enable --now ssh.service
          sudo ufw --force reset
          sudo ufw --force disable || true
          cleanup() {
            sudo ufw --force reset >/dev/null 2>&1 || true
            sudo rm -f /etc/hyzorax-control/config.toml
          }
          trap cleanup EXIT
          sudo -E unshare --net env HYZORAX_SECURITY_FIREWALL_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestSecurityFirewallAcceptance$' -count=1 -v

      - name: Build and verify V1.7.3
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.7.3
          ./build/hyzorax-control -version | grep -q '1.7.3'
          ./build/hyzorax-control-helper -version | grep -q '1.7.3'
          grep -q 'const ProtocolVersion = 20' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package validation artifact
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: HYZoraX-V1.7.3-firewall-validation
          path: |
            HYZoraX_Control_Center_Linux_x86_64.tar.gz
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
