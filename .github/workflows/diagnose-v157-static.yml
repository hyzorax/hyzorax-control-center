name: Diagnose V1.5.7 static gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/v1.5.7-editor-workspace'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.6 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          python3 release-patch/v1.5.7/apply.py work/hyzorax-control
          python3 release-patch/v1.5.7/fix.py work/hyzorax-control
      - name: Labeled assertions
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          check(){ local label="$1"; shift; if "$@"; then echo "PASS: ${label}"; else echo "FAIL: ${label}" >&2; exit 1; fi; }
          check js node --check internal/web/static/app.js
          check bootstrap bash -n packaging/bootstrap.sh
          check dashboard bash -n packaging/hyzorax-dashboard
          check tls bash -n packaging/hyzorax-control-tls
          check updater bash -n packaging/hyzorax-control-updater
          check hz bash -n packaging/hz
          check version grep -q 'Version 1.5.7' internal/web/static/index.html
          check setup-form grep -q 'id="setup-form"' internal/web/static/index.html
          check remember-me grep -q 'Remember me' internal/web/static/index.html
          check setup-status-route grep -q 'GET /api/v1/auth/setup/status' internal/httpapi/app.go
          check setup-post-route grep -q 'POST /api/v1/auth/setup' internal/httpapi/app.go
          check pending-sentinel grep -q 'PendingOwnerPasswordHash' internal/store/store.go
          check remember-ttl grep -q 'rememberSessionTTL' internal/httpapi/handlers.go
          check find-panel grep -q 'id="editor-find-panel"' internal/web/static/index.html
          check replace-row grep -q 'id="editor-replace-row"' internal/web/static/index.html
          check tree grep -q 'id="editor-tree-content"' internal/web/static/index.html
          check tabs grep -q 'id="editor-tabs"' internal/web/static/index.html
          check tree-loader grep -q 'loadEditorTreeRoot' internal/web/static/app.js
          check replace-all grep -q 'replaceEditorAll' internal/web/static/app.js
          check capture grep -q 'window.addEventListener("keydown",captureEditorShortcut,true)' internal/web/static/app.js
          check live-search grep -q 'collectEditorFindMatches(true)' internal/web/static/app.js
          check dash-user grep -q 'Username:' packaging/hyzorax-dashboard
          check dash-url grep -q 'Panel URL:' packaging/hyzorax-dashboard
          check dash-memory grep -q 'Memory:' packaging/hyzorax-dashboard
          check dash-reboot grep -q 'Reboot:' packaging/hyzorax-dashboard
          find internal/installer -type f -print
          if grep -q 'window.confirm(' internal/web/static/app.js; then echo 'FAIL: native-confirm' >&2; exit 1; else echo 'PASS: native-confirm'; fi
          if grep -q 'Initial Owner password: ' packaging/bootstrap.sh; then echo 'FAIL: password-exposure' >&2; exit 1; else echo 'PASS: password-exposure'; fi
          if grep -qE '^Project:|^Domain:|Foundation locked and live' packaging/hyzorax-dashboard; then echo 'FAIL: legacy-dashboard' >&2; exit 1; else echo 'PASS: legacy-dashboard'; fi
