name: Validate V1.7.6 Security Activity
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  validate-v176:
    if: github.head_ref == 'agent/v1.7.6-security-activity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download exact V1.7.5 release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v176
          gh release download v1.7.5 --repo "$GITHUB_REPOSITORY" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz*' --dir /tmp/v176
          cd /tmp/v176
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz
          sha256sum hyzorax-control/packaging/hz > base-hz.sha256
      - name: Apply V1.7.6 patch
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.7.6/security_activity_sessions.py
          python3 release-patch/v1.7.6/security_activity_sessions.py /tmp/v176/hyzorax-control
      - name: Static security regressions
        run: |
          set -Eeuo pipefail
          SRC=/tmp/v176/hyzorax-control
          grep -q 'const ProtocolVersion = 21' "$SRC/internal/helper/protocol.go"
          grep -q 'Version 1.7.6' "$SRC/internal/web/static/index.html"
          grep -q 'api/v1/security/activity' "$SRC/internal/httpapi/app.go"
          grep -q 'api/v1/security/sessions/revoke' "$SRC/internal/httpapi/app.go"
          grep -q 'id <> ?' "$SRC/internal/store/store.go"
          grep -q 'user_id = ?' "$SRC/internal/store/store.go"
          grep -q 'securityActivitySessionLimit = 50' "$SRC/internal/httpapi/security_activity.go"
          grep -q 'securityActivityEventLimit = 80' "$SRC/internal/httpapi/security_activity.go"
          grep -q 'Current browser' "$SRC/internal/web/static/app.js"
          grep -q 'Install Fail2ban' "$SRC/internal/web/static/app.js"
          if grep -E 'token_hash|csrf_hash|metadata_json' "$SRC/internal/httpapi/security_activity.go" "$SRC/internal/web/static/app.js"; then
            echo 'Security activity payload appears to expose a secret-bearing field' >&2
            exit 1
          fi
          (cd /tmp/v176 && sha256sum -c base-hz.sha256)
          node --check "$SRC/internal/web/static/app.js"
          bash -n "$SRC/packaging/bootstrap.sh" "$SRC/packaging/hyzorax-control-updater" "$SRC/packaging/hz"
      - name: Test, race-check, and vet
        working-directory: /tmp/v176/hyzorax-control
        run: |
          set -Eeuo pipefail
          go test ./...
          go test -race ./internal/store ./internal/httpapi
          go vet ./...
      - name: Build V1.7.6 binaries
        working-directory: /tmp/v176/hyzorax-control
        run: |
          set -Eeuo pipefail
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.6' -o build/hyzorax-control ./cmd/hyzorax-control
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.6' -o build/hyzorax-control-helper ./cmd/hyzorax-control-helper
          test "$(build/hyzorax-control -version | awk '{print $NF}')" = '1.7.6'
          test "$(build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.6'
