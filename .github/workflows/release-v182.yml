name: Validate and publish V1.8.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v182.yml"
  pull_request:
    branches: [main]
    paths:
      - "release-patch/v1.8.2/**"
      - ".github/workflows/release-v182.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified V1.8.2 GitHub release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: v1.8.2-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: "1.8.2"
  BASE_TAG: "v1.8.1"
  ARCHIVE: "HYZoraX_Control_Center_Linux_x86_64.tar.gz"
  BASE_SHA256: "94428c97cc850115e96e20ff12cd374babe776d4f5c640409d3f94b04d78274c"
  PATCH_FILE: "release-patch/v1.8.2/logo_palette.py"
  PATCH_SHA256: "987aff76bd43a2dcc35ccd5ee59eaf2b35b160bc6ba46f11a6c8665444890052"
  INDEX_SHA256: "c28838761f662e1efda15570ae52683817af29f238b88ea5c15f9c798e47e1a1"
  CSS_SHA256: "0d3ab1908821983d461c449b2ddc614a355f22b4c9886c67ef7edcaa007b500c"
  JS_SHA256: "7fb9695274f55ce33f9eec39637694e83eec22f35025bba77d1bafcec01b3437"
  ASSETS_TEST_SHA256: "e3200fad0cd81c948bb7995afb76e8b3f4f914fc223b37585cede79874ea247c"
  HTTPAPI_TEST_SHA256: "4367bdf342297e2949723c43bb13675ffa71fa599ccc4eb3bf52a855da114603"
  HZ_SHA256: "7ecc6c68e5507007424ca263fa0ee4b1ece25aae9c60257fb283d6cc62cd21b5"

jobs:
  validate-build-publish:
    name: Reconstruct, validate, build, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Download and authenticate V1.8.1 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf -- _release-work
          mkdir -p _release-work/base
          gh release download "$BASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir _release-work \
            --pattern "$ARCHIVE" \
            --pattern "$ARCHIVE.sha256"
          echo "$BASE_SHA256  _release-work/$ARCHIVE" | sha256sum -c -
          (cd _release-work && sha256sum -c "$ARCHIVE.sha256")
          tar -xzf "_release-work/$ARCHIVE" -C _release-work/base
          source_dir="$(find _release-work/base -type f -name go.mod -printf '%h\n' -quit)"
          test -n "$source_dir"
          printf '%s\n' "$source_dir" > _release-work/source-path
          grep -F "Version 1.8.1" "$source_dir/internal/web/static/index.html"
          grep -F "const ProtocolVersion = 21" "$source_dir/internal/helper/protocol.go"

      - name: Authenticate and apply V1.8.2 patch
        run: |
          set -Eeuo pipefail
          echo "$PATCH_SHA256  $PATCH_FILE" | sha256sum -c -
          python3 -m py_compile "$PATCH_FILE"
          source_dir="$(cat _release-work/source-path)"
          python3 "$PATCH_FILE" "$source_dir"

      - name: Verify release invariants
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          echo "$INDEX_SHA256  $source_dir/internal/web/static/index.html" | sha256sum -c -
          echo "$CSS_SHA256  $source_dir/internal/web/static/app.css" | sha256sum -c -
          echo "$JS_SHA256  $source_dir/internal/web/static/app.js" | sha256sum -c -
          echo "$ASSETS_TEST_SHA256  $source_dir/internal/web/assets_test.go" | sha256sum -c -
          echo "$HTTPAPI_TEST_SHA256  $source_dir/internal/httpapi/app_test.go" | sha256sum -c -
          echo "$HZ_SHA256  $source_dir/packaging/hz" | sha256sum -c -
          grep -F "Version 1.8.2" "$source_dir/internal/web/static/index.html"
          grep -F '#70effd' "$source_dir/internal/web/static/app.css"
          grep -F '#32affd' "$source_dir/internal/web/static/app.css"
          grep -F '#0f6ff2' "$source_dir/internal/web/static/app.css"
          grep -F '.file-row-menu-open' "$source_dir/internal/web/static/app.css"
          grep -F -- '--file-menu-anchor-x' "$source_dir/internal/web/static/app.css"
          grep -F 'menu.dataset.placement' "$source_dir/internal/web/static/app.js"
          grep -F 'window.addEventListener("resize", closeFileActionMenus)' "$source_dir/internal/web/static/app.js"
          grep -F "const ProtocolVersion = 21" "$source_dir/internal/helper/protocol.go"
          grep -F 'headers.set("Content-Type", "application/json")' "$source_dir/internal/web/static/app.js"
          test "$(grep -o 'id="[^"]*"' "$source_dir/internal/web/static/index.html" | sort | uniq -d | wc -l)" -eq 0

      - name: Run static checks
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh packaging/hyzorax-control-tls packaging/hyzorax-control-updater packaging/hyzorax-dashboard packaging/hz

      - name: Run Go tests, race checks, and vet
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          go test ./...
          go test -race ./internal/config ./internal/cryptoutil ./internal/helper ./internal/httpapi ./internal/installer ./internal/store ./internal/web
          go vet ./...

      - name: Build authenticated V1.8.2 bundle
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          rm -f -- build/hyzorax-control build/hyzorax-control-helper build/SHA256SUMS
          make release VERSION="$VERSION"
          test "$(./build/hyzorax-control -version)" = "hyzorax-control $VERSION"
          test "$(./build/hyzorax-control-helper -version)" = "hyzorax-control-helper $VERSION"
          (cd build && sha256sum --check --strict SHA256SUMS)

      - name: Package and validate installer-compatible archive
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          mkdir -p _release-work/package/hyzorax-control
          cp -a "$source_dir/." _release-work/package/hyzorax-control/
          tar -C _release-work/package -czf "_release-work/$ARCHIVE" hyzorax-control
          (cd _release-work && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          (cd _release-work && sha256sum -c "$ARCHIVE.sha256")
          mkdir -p _release-work/package-check
          tar -xzf "_release-work/$ARCHIVE" -C _release-work/package-check
          packaged_root="_release-work/package-check/hyzorax-control"
          test -f "$packaged_root/go.mod"
          test -f "$packaged_root/build/SHA256SUMS"
          test -x "$packaged_root/build/hyzorax-control"
          test -x "$packaged_root/build/hyzorax-control-helper"
          test -x "$packaged_root/build/bootstrap.sh"
          (cd "$packaged_root/build" && sha256sum --check --strict SHA256SUMS)
          test "$("$packaged_root/build/hyzorax-control" -version)" = "hyzorax-control $VERSION"
          test "$("$packaged_root/build/hyzorax-control-helper" -version)" = "hyzorax-control-helper $VERSION"

      - name: Publish V1.8.2 release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            "_release-work/$ARCHIVE" \
            "_release-work/$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HYZoraX Control Center V1.8.2" \
            --notes "V1.8.2 applies the supplied HYZoraX logo palette throughout the Control Center: ice-white surfaces, luminous aqua and cyan accents, sky-blue controls, and royal-blue focus states. File Manager actions now stay anchored to the selected row, intelligently open above or below according to viewport space, and close safely on resize or external scroll. Existing Protocol V21, guarded filesystem operations, updater behaviour, security controls, applications catalogue, and the hz launcher are retained."

      - name: Verify published release and assets
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p _release-work/published _release-work/published-check
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir _release-work/published --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          (cd _release-work/published && sha256sum -c "$ARCHIVE.sha256")
          tar -xzf "_release-work/published/$ARCHIVE" -C _release-work/published-check
          published_root="_release-work/published-check/hyzorax-control"
          test -f "$published_root/go.mod"
          (cd "$published_root/build" && sha256sum --check --strict SHA256SUMS)
          test "$("$published_root/build/hyzorax-control" -version)" = "hyzorax-control $VERSION"
          test "$("$published_root/build/hyzorax-control-helper" -version)" = "hyzorax-control-helper $VERSION"
          grep -F "Version 1.8.2" "$published_root/internal/web/static/index.html"
          echo "$CSS_SHA256  $published_root/internal/web/static/app.css" | sha256sum -c -
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url
