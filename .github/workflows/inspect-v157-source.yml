name: Inspect V1.5.6 source for V1.5.7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-v157:
    if: github.event.pull_request.head.ref == 'agent/v1.5.7-editor-workspace'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.5.6 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.6 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
      - name: Inspect focused source
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          for spec in \
            'internal/httpapi/handlers.go:1:210' \
            'internal/httpapi/middleware.go:100:240' \
            'internal/httpapi/app_test.go:1:170' \
            'cmd/hyzorax-control/main.go:1:220' \
            'cmd/hyzorax-control/main_test.go:1:90' \
            'internal/web/static/index.html:1:85' \
            'internal/web/static/index.html:245:315' \
            'internal/web/static/app.js:1:185' \
            'internal/web/static/app.js:235:360' \
            'internal/web/static/app.js:535:640' \
            'internal/web/static/app.js:915:970' \
            'internal/web/static/app.css:250:340' \
            'internal/web/static/app.css:780:910' \
            'packaging/bootstrap.sh:170:225' \
            'packaging/bootstrap.sh:360:420' \
            'packaging/bootstrap.sh:495:535' \
            'internal/config/config.go:1:145' \
            'internal/systeminfo/summary_linux.go:1:320'; do
            file="${spec%%:*}"; rest="${spec#*:}"; start="${rest%%:*}"; end="${rest##*:}"
            echo "===== ${file}:${start}-${end} ====="
            sed -n "${start},${end}p" "${file}"
          done
