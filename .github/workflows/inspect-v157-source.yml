name: Inspect V1.5.6 source for V1.5.7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-v157:
    if: github.event.pull_request.head.ref == 'agent/v1.5.7-editor-workspace'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.5.6 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.6 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
      - name: Inspect source paths
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== SOURCE FILES ====='
          find internal packaging cmd -maxdepth 3 -type f | sort
          echo '===== AUTH/SETUP/SESSION HITS ====='
          grep -RniE 'pending.?setup|password|login|session|remember|username|credential|entrance|first.?run' internal packaging cmd | head -n 700 || true
          echo '===== BOOTSTRAP RELEVANT ====='
          grep -nE 'Username:|Password:|final_username|final_password|pending|credential|bootstrap|install_completed|entrance|panel_url|Panel URL|MOTD|motd|update-motd' packaging/bootstrap.sh | head -n 300 || true
          echo '===== STORE FILES ====='
          find internal/store -maxdepth 2 -type f -print -exec sh -c 'echo --- $1; sed -n "1,320p" "$1"' _ {} \;
          echo '===== HTTP APP ====='
          sed -n '1,520p' internal/httpapi/app.go
          echo '===== HTTP APP CONT ====='
          sed -n '521,1100p' internal/httpapi/app.go
          echo '===== STATIC INDEX EDITOR/LOGIN ====='
          grep -nE 'login|password|remember|editor-dialog|editor-find|file-manager|Version 1.5.6' internal/web/static/index.html | head -n 300 || true
          echo '===== JS AUTH/EDITOR/FILEROUTES ====='
          grep -nE 'login|password|remember|session|openEditor|editorFind|loadFiles|file-list|files/list|editor-dialog|Ctrl|keydown' internal/web/static/app.js | head -n 800 || true
          echo '===== HZ ====='
          sed -n '1,420p' packaging/hz
