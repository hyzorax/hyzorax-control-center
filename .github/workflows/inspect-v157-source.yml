name: Inspect V1.5.6 source for V1.5.7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-v157:
    if: github.event.pull_request.head.ref == 'agent/v1.5.7-editor-workspace'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.5.6 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.6 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
      - name: Inspect store/editor/build internals
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          for spec in \
            'internal/store/store.go:1:520' \
            'internal/cryptoutil/password.go:1:260' \
            'internal/httpapi/app.go:1:220' \
            'internal/web/static/app.js:700:930' \
            'Makefile:1:260' \
            'packaging/config.toml:1:180' \
            'packaging/bootstrap.sh:1:170' \
            'packaging/bootstrap.sh:420:505'; do
            file="${spec%%:*}"; rest="${spec#*:}"; start="${rest%%:*}"; end="${rest##*:}"
            echo "===== ${file}:${start}-${end} ====="
            sed -n "${start},${end}p" "${file}"
          done
