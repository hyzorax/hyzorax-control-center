name: Build and release V1.7.2 SSH alias no-op hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v172:
    if: github.event.pull_request.head.ref == 'agent/v1.7.2-ssh-alias-noop-hotfix'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.7.1 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.7.1 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 19' work/hyzorax-control/internal/helper/protocol.go
          grep -q 'func securityRootPolicyEquivalent' work/hyzorax-control/internal/helper/security_linux.go
          grep -q 'Version 1.7.1' work/hyzorax-control/internal/web/static/index.html

      - name: Apply V1.7.2 hotfix
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.7.2/ssh_alias_noop.py
          python3 release-patch/v1.7.2/ssh_alias_noop.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/helper/security_linux.go internal/helper/security_linux_test.go internal/helper/security_ssh_acceptance_test.go

      - name: Static hotfix checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'rootRequested := input.RootLogin != "keep" && !securityRootPolicyEquivalent(currentRoot, desiredRoot)' internal/helper/security_linux.go
          grep -q 'func TestSecurityRootPolicyEquivalentAliases' internal/helper/security_linux_test.go
          grep -q 'func TestSecuritySSHApplyAliasNoKeyNoopAcceptance' internal/helper/security_ssh_acceptance_test.go
          grep -q 'Version 1.7.2' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 19' internal/helper/protocol.go
          if grep -Rni -E 'systemctl.*(stop|disable)|ssh\.service.*stop|sshd\.service.*stop' internal/helper/security_linux.go; then
            echo 'V1.7.2 must not stop or disable SSH.' >&2
            exit 1
          fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Real Ubuntu 24.04 screenshot regression acceptance
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=120 -y --no-install-recommends install openssh-server
          sudo mkdir -p /run/sshd /root/.ssh
          sudo chmod 0700 /root/.ssh
          sudo systemctl enable --now ssh.service
          had_keys=false
          if sudo test -f /root/.ssh/authorized_keys; then
            had_keys=true
            sudo cp -a /root/.ssh/authorized_keys /tmp/hyzorax-root-authorized_keys.backup
          fi
          rm -f /tmp/hyzorax-v172-key /tmp/hyzorax-v172-key.pub
          ssh-keygen -q -t ed25519 -N '' -f /tmp/hyzorax-v172-key
          sudo cp /tmp/hyzorax-v172-key.pub /root/.ssh/authorized_keys
          sudo chmod 0600 /root/.ssh/authorized_keys
          cleanup() {
            if [[ "$had_keys" == true ]]; then sudo cp -a /tmp/hyzorax-root-authorized_keys.backup /root/.ssh/authorized_keys; else sudo rm -f /root/.ssh/authorized_keys; fi
            sudo /usr/sbin/sshd -t || true
            sudo systemctl reload ssh.service 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo -E env HYZORAX_SECURITY_SSH_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestSecuritySSHApply(Acceptance|AliasNoKeyNoopAcceptance)$' -count=1 -v
          sudo /usr/sbin/sshd -t
          systemctl is-active --quiet ssh.service

      - name: Build and verify V1.7.2
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.7.2
          ./build/hyzorax-control -version | grep -q '1.7.2'
          ./build/hyzorax-control-helper -version | grep -q '1.7.2'
          grep -q 'const ProtocolVersion = 19' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.7.2 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.7.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.7.2 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.7.2' \
            --notes 'V1.7.2 is a focused SSH Security hotfix for V1.7.1. OpenSSH may report the keys-only PermitRootLogin policy as without-password while HYZoraX writes prohibit-password. V1.7.1 already treated those values as equivalent during post-write verification, but its pre-write delta detection still compared them literally. That could make an unchanged Keys only policy appear restrictive and incorrectly trigger the root-key lockout guard. V1.7.2 uses semantic equivalence during change detection as well, so an unchanged Keys only + Password authentication Enabled policy is a true no-op even when no root key is detected. A real Ubuntu 24.04 regression test reproduces that exact state with the root authorized key removed and requires changed=false with no lockout error. SSH safety validation/rollback remain unchanged. Helper protocol remains V19 and hz remains unchanged.' \
            --latest
