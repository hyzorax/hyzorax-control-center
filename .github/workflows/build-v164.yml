name: Build and release V1.6.4 Redis Installer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v164:
    if: github.event.pull_request.head.ref == 'agent/v1.6.4-redis-installer'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download V1.6.3 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.6.3 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 13' work/hyzorax-control/internal/helper/protocol.go
      - name: Apply V1.6.4
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.6.4/apply.py
          python3 release-patch/v1.6.4/apply.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/installer/*.go internal/helper/*.go internal/web/assets_test.go internal/httpapi/app_test.go
      - name: Static and security checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'Version 1.6.4' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 14' internal/helper/protocol.go
          grep -q 'func RedisManifest' internal/installer/builtin.go
          grep -q 'installer.redis.preflight' internal/helper/server_linux.go
          grep -q 'installer.redis.install' internal/helper/server_linux.go
          grep -q 'installer.redis.health' internal/helper/server_linux.go
          grep -q 'installer.redis.rollback' internal/helper/server_linux.go
          grep -q 'protected-mode","yes"' internal/helper/installer_redis_linux.go
          grep -q 'appendonly","yes"' internal/helper/installer_redis_linux.go
          grep -q '127.0.0.1 ::1' internal/helper/installer_redis_linux.go
          if grep -Rni --include='installer_redis_linux.go' -E 'request\.Params.*(package|command|config)|/bin/sh|bash -c|exec\.CommandContext\(ctx, executable' internal/helper; then
            echo 'Redis installer appears to accept dynamic privileged execution' >&2
            exit 1
          fi
      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...
      - name: Real Ubuntu 24.04 Redis acceptance
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          existing=false
          if dpkg-query -W -f='${Status}' redis-server 2>/dev/null | grep -q '^install ok installed$'; then existing=true; fi
          if [[ -e /etc/redis || -x /usr/bin/redis-server ]]; then existing=true; fi
          if [[ "${existing}" == true ]]; then
            echo 'Runner has existing Redis state; first verify HYZoraX refuses to overwrite/adopt it.'
            sudo -E env HYZORAX_INSTALLER_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestRedisInstallerRejectsExistingState$' -count=1 -v
            sudo systemctl stop redis-server 2>/dev/null || true
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=120 -y purge redis-server redis-tools || true
            sudo rm -rf /etc/redis /var/lib/redis
          fi
          sudo rm -f /var/lib/hyzorax-control/installer-managed/redis
          if [[ -e /etc/redis || -x /usr/bin/redis-server ]] || dpkg-query -W -f='${Status}' redis-server 2>/dev/null | grep -q '^install ok installed$'; then
            echo 'Disposable runner still has Redis state after cleanup.' >&2
            exit 1
          fi
          sudo -E env HYZORAX_INSTALLER_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestRedisInstallerAcceptance$' -count=1 -v
          if systemctl is-active --quiet redis-server 2>/dev/null; then
            echo 'Redis remained active after acceptance rollback.' >&2
            exit 1
          fi
          if dpkg-query -W -f='${Status}' redis-server 2>/dev/null | grep -q '^install ok installed$'; then
            echo 'Redis package remained installed after acceptance rollback.' >&2
            exit 1
          fi
          if ss -H -ltn 'sport = :6379' | grep -q .; then
            echo 'Redis TCP 6379 remained listening after rollback.' >&2
            exit 1
          fi
      - name: Build and verify V1.6.4
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.6.4
          ./build/hyzorax-control -version | grep -q '1.6.4'
          ./build/hyzorax-control-helper -version | grep -q '1.6.4'
          grep -q 'const ProtocolVersion = 14' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)
      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
      - name: Publish V1.6.4 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.6.4 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.4 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.6.4' \
            --notes 'Redis clean-install acceptance for Ubuntu 24.04 using the fixed Ubuntu redis-server/redis-tools package set. HYZoraX refuses existing Redis/config or occupied TCP 6379, applies localhost-only bind, protected-mode yes and append-only persistence, verifies PONG/service/config/listener health, and requires a HYZoraX ownership marker before destructive rollback. Real install/health/rollback acceptance runs on disposable Ubuntu 24.04. Helper protocol V14. No new hz menu entry and no browser Installer UI is exposed yet.' \
            --latest
