name: Inspect V1.7.0 SSH security surface

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-v171:
    if: github.event.pull_request.head.ref == 'agent/v1.7.1-ssh-security-controls'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.7.0 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.7.0 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
      - name: Inspect SSH/security UI and helper surface
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== SECURITY HELPER ====='
          sed -n '1,360p' internal/helper/security_linux.go
          echo '===== SECURITY DISPATCH ====='
          grep -n -A40 -B8 'security.summary' internal/helper/server_linux.go || true
          echo '===== SECURITY HTTP ====='
          sed -n '1,260p' internal/httpapi/security.go
          echo '===== SECURITY ROUTES ====='
          grep -n -A10 -B6 '/api/v1/security' internal/httpapi/app.go || true
          echo '===== SECURITY HTML ====='
          grep -n -A260 -B20 'id="security-view"' internal/web/static/index.html | head -n 340 || true
          echo '===== SECURITY CSS ====='
          grep -n -A260 -B20 -E 'security-|posture|listening|listener|security-card' internal/web/static/app.css | head -n 500 || true
          echo '===== SECURITY JS ====='
          grep -n -A320 -B30 -E 'loadSecurity|renderSecurity|security-summary|security-' internal/web/static/app.js | head -n 620 || true
          echo '===== SSH CONFIG PACKAGING ====='
          grep -RniE 'sshd_config|ssh\.service|PrintLastLog|hyzorax.*ssh|security.*ssh' packaging internal | head -n 500 || true
