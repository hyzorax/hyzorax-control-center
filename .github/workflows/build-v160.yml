name: Build and release V1.6.0 Installer Engine

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v160:
    if: github.event.pull_request.head.ref == 'agent/v1.6.0-installer-engine'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download V1.5.8 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.8 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 10' work/hyzorax-control/internal/helper/protocol.go
      - name: Apply V1.6.0
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.6.0/apply.py
          python3 release-patch/v1.6.0/apply.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/installer/*.go internal/store/installer_*.go internal/web/assets_test.go internal/httpapi/app_test.go
      - name: Static and architecture checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'Version 1.6.0' internal/web/static/index.html
          grep -q 'ManifestSchemaVersion = 1' internal/installer/manifest.go
          grep -q 'allowedOperationActions' internal/installer/manifest.go
          grep -q 'installer_jobs' internal/store/installer_migration.go
          grep -q 'installer_job_events' internal/store/installer_migration.go
          grep -q 'type DurableTracker' internal/installer/persistence.go
          grep -q 'type EventBus' internal/installer/job.go
          grep -q 'RunPreflight' internal/installer/preflight.go
          grep -q 'const ProtocolVersion = 10' internal/helper/protocol.go
          if grep -Rni --include='*.go' -E 'exec\.Command\(|/bin/sh|bash -c' internal/installer; then
            echo 'Installer Engine core must not contain free-form command execution' >&2
            exit 1
          fi
      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...
      - name: Build and verify V1.6.0
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.6.0
          ./build/hyzorax-control -version | grep -q '1.6.0'
          ./build/hyzorax-control-helper -version | grep -q '1.6.0'
          grep -q 'Version 1.6.0' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 10' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)
      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
      - name: Publish V1.6.0 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.6.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.0 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.6.0' \
            --notes 'P5 Installer Engine foundation. Adds a versioned manifest schema and catalog with dependency/conflict planning, typed operation/check allow-lists with no free-form shell execution, deterministic version selection, resource/OS/port preflight reports, durable SQLite installer jobs and ordered progress events, a live in-process progress event bus, and rollback state-machine foundations. No Installer UI/sidebar entry is exposed yet, no hz menu entries are changed, and no real package installer executes in this release. Helper protocol remains V10. Next planned acceptance target is the first real Nginx installer on top of this engine.' \
            --latest
