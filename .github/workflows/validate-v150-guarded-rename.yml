name: Validate V1.5.0 guarded rename

on:
  push:
    branches:
      - agent/v1.5.0-guarded-rename
    paths:
      - '.github/workflows/validate-v150-guarded-rename.yml'
      - 'release-patch/v1.5.0/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.4.4 source release
        run: |
          set -Eeuo pipefail
          mkdir -p work
          curl -fL --retry 3 \
            https://github.com/hyzorax/hyzorax-control-center/releases/download/v1.4.4/HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            -o /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control

      - name: Reassemble guarded rename patch
        run: |
          set -Eeuo pipefail
          base64 -d release-patch/v1.5.0/guarded-rename.patch.gz.b64 > /tmp/guarded-rename.patch.gz
          gzip -dc /tmp/guarded-rename.patch.gz > /tmp/guarded-rename.patch
          test -s /tmp/guarded-rename.patch
          grep -q 'filesystemRename' /tmp/guarded-rename.patch
          grep -q 'RENAME_NOREPLACE' /tmp/guarded-rename.patch

      - name: Apply V1.5.0 guarded rename patch
        run: |
          set -Eeuo pipefail
          patch --batch -p1 -d work/hyzorax-control < /tmp/guarded-rename.patch

      - name: Static syntax and version checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          gofmt -w internal/helper/filesystem_linux.go internal/helper/filesystem_linux_test.go internal/helper/protocol.go internal/helper/server_linux.go internal/httpapi/app.go internal/httpapi/app_test.go internal/httpapi/files_test.go internal/httpapi/handlers.go internal/web/assets_test.go
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hyzorax-control-tls
          bash -n packaging/hyzorax-control-updater
          bash -n packaging/hz
          grep -q 'const ProtocolVersion = 5' internal/helper/protocol.go
          grep -q 'RENAME_NOREPLACE' internal/helper/filesystem_linux.go
          grep -q 'filesystem.rename' internal/helper/server_linux.go
          grep -q 'api/v1/files/rename' internal/web/static/app.js
          grep -q 'Version 1.5.0' internal/web/static/index.html

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build validation package
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.5.0
          ./build/hyzorax-control -version | grep -q '1.5.0'
          ./build/hyzorax-control-helper -version | grep -q '1.5.0'
          (cd build && sha256sum -c SHA256SUMS)

      - name: Guarded rename validation summary
        run: |
          echo 'V1.5.0 Guarded Rename validation passed.'
          echo 'No public release was published by this workflow.'
