name: Inspect V1.6.10 security foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/v1.7.0-security-center-readonly'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.6.10 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.6.10 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
      - name: Inspect security and service foundations
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== SECURITY SIDEBAR / VIEW ====='
          grep -n -A20 -B8 -E 'Security|security-view|data-view="security"|href="#security"' internal/web/static/index.html | head -n 220 || true
          echo '===== VIEW ROUTING JS ====='
          grep -n -A70 -B20 -E 'viewFromHash|switchView|security' internal/web/static/app.js | head -n 340 || true
          echo '===== HTTP ROUTES ====='
          sed -n '55,115p' internal/httpapi/app.go
          echo '===== SERVICE HTTP API ====='
          grep -RniE 'service.status|handle.*Service|ServiceStatus' internal/httpapi internal/helper | head -n 420 || true
          echo '===== HELPER SERVICE ACTIONS ====='
          grep -n -A180 -B30 -E 'service.status|service.start|service.stop|service.restart|AllowsService|allowed.*service' internal/helper/server_linux.go internal/helper/policy.go internal/helper/policy_test.go | head -n 650 || true
          echo '===== SECURITY RELEVANT LINUX HELPERS ====='
          grep -RniE 'ufw|nft|iptables|sshd|ssh.service|fail2ban|listen|socket|port' internal/helper internal/httpapi | head -n 900 || true
          echo '===== HELPER PROTOCOL ====='
          cat internal/helper/protocol.go
          echo '===== HELPER SERVER CONSTRUCTION ====='
          grep -RniE 'NewPolicy\(|AllowedUID|SocketGID|Policy:' cmd internal | head -n 320 || true
          echo '===== SYSTEMD STATUS FUNCTION ====='
          grep -RniE 'func systemdStatus|systemctl.*show|ActiveState|SubState' internal/helper | head -n 260 || true
          echo '===== CSS REUSABLE LAYOUTS ====='
          grep -n -A80 -B20 -E '\.panel|\.metrics-grid|\.software-manager|\.application-status|\.alert' internal/web/static/styles.css internal/web/static/style.css 2>/dev/null | head -n 900 || true
          echo '===== STATIC FILE LIST ====='
          find internal/web/static -maxdepth 1 -type f -printf '%f\n' | sort
          echo '===== APP TESTS / WEB TESTS ====='
          grep -RniE 'Applications|Security|Soon|Version 1\.6\.10' internal/httpapi/*_test.go internal/web/*_test.go | head -n 500 || true
