name: Build and release V1.6.10 core Applications catalog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v1610:
    if: github.event.pull_request.head.ref == 'agent/v1.6.10-core-app-catalog'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.6.9 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.6.9 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          sha256sum work/hyzorax-control/internal/helper/protocol.go | awk '{print $1}' > /tmp/protocol-before.sha
          sha256sum work/hyzorax-control/internal/helper/server_linux.go | awk '{print $1}' > /tmp/helper-server-before.sha
          grep -q 'const ProtocolVersion = 17' work/hyzorax-control/internal/helper/protocol.go

      - name: Apply V1.6.10 catalog
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.6.10/core_catalog.py
          python3 release-patch/v1.6.10/core_catalog.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/httpapi/app.go internal/httpapi/applications.go internal/httpapi/applications_test.go internal/web/assets_test.go internal/httpapi/app_test.go

      - name: Static and scope checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          test "$(sha256sum internal/helper/protocol.go | awk '{print $1}')" = "$(cat /tmp/protocol-before.sha)"
          test "$(sha256sum internal/helper/server_linux.go | awk '{print $1}')" = "$(cat /tmp/helper-server-before.sha)"
          grep -q 'Version 1.6.10' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 17' internal/helper/protocol.go
          grep -q '<span id="applications-visible-count">7 apps</span>' internal/web/static/index.html
          for id in nginx php84 postgresql18 redis node24 composer fail2ban; do
            grep -q "id=\"${id}-card\"" internal/web/static/index.html
            grep -q "id=\"${id}-install-button\"" internal/web/static/index.html
            grep -q "POST /api/v1/applications/${id}/install" internal/httpapi/app.go
            grep -q "installer.${id}.install" internal/httpapi/applications.go
          done
          grep -q 'installer.nginx.health' internal/httpapi/applications.go
          grep -q 'installer.php84.health' internal/httpapi/applications.go
          grep -q 'installer.postgresql18.health' internal/httpapi/applications.go
          grep -q 'installer.redis.health' internal/httpapi/applications.go
          grep -q 'installer.fail2ban.health' internal/httpapi/applications.go
          grep -q 'href="#services"><span>◉</span>Services <em>Soon</em>' internal/web/static/index.html
          grep -q 'href="#databases"><span>▥</span>Databases <em>Soon</em>' internal/web/static/index.html
          grep -q 'applications-search' internal/web/static/index.html
          grep -q 'data-app-filter="installed"' internal/web/static/index.html
          grep -q 'data-app-filter="available"' internal/web/static/index.html
          grep -q 'data-app-filter="attention"' internal/web/static/index.html
          if grep -Rni --include='applications.go' -E 'exec\.Command|/bin/sh|bash -c|request\.(URL|Body).*Action' internal/httpapi; then
            echo 'Applications API must not introduce direct privileged execution or dynamic helper actions' >&2
            exit 1
          fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build and verify V1.6.10
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.6.10
          ./build/hyzorax-control -version | grep -q '1.6.10'
          ./build/hyzorax-control-helper -version | grep -q '1.6.10'
          grep -q 'const ProtocolVersion = 17' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.6.10 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.6.10 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.10 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.6.10' \
            --notes 'V1.6.10 completes the initial official Applications catalog using the already-accepted guarded installer backends. The Applications software manager now exposes Nginx, PHP 8.4 FPM, PostgreSQL 18, Redis, Node.js 24 LTS, Composer and Fail2ban SSH Protection with live status, search, Installed/Available/Needs attention filters, dependency/conflict states and explicit install confirmation. Composer remains dependent on PHP 8.4 and Fail2ban requires existing OpenSSH. Services and Databases remain Soon. No new hz menu entries were added and helper protocol remains V17.' \
            --latest
