name: Inspect V1.6.7 UI for V1.6.8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/v1.6.8-services-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.6.7 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.6.7 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
      - name: Print exact V1.6.8 integration markers
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== HTML WORKSPACE ====='
          sed -n '35,230p' internal/web/static/index.html
          echo '===== JS BOOT + SWITCH VIEW ====='
          sed -n '1,175p' internal/web/static/app.js
          echo '===== JS EVENT WIRING ====='
          sed -n '635,700p' internal/web/static/app.js
          echo '===== HTTP APP ROUTES ====='
          sed -n '1,115p' internal/httpapi/app.go
          echo '===== HELPER HEALTH HANDLER ====='
          sed -n '220,270p' internal/httpapi/handlers.go
          echo '===== CONTEXT SESSION HELPERS ====='
          grep -Rni -B5 -A12 -E 'sessionFromContext|userFromContext|type sessionContext|contextKeySession' internal/httpapi || true
          echo '===== NODE INSTALLER ACTIONS ====='
          grep -n -B5 -A22 'installer.node24' internal/helper/server_linux.go
          echo '===== COMPOSER INSTALLER ACTIONS ====='
          grep -n -B5 -A22 'installer.composer' internal/helper/server_linux.go
          echo '===== NODE STATE HELPERS ====='
          grep -n -B5 -A30 'func node24StateExists' internal/helper/installer_node24_linux.go || true
          echo '===== COMPOSER STATE HELPERS ====='
          grep -n -B5 -A30 'func composerStateExists' internal/helper/installer_composer_linux.go || true
