name: Build and release V1.6.7 Fail2ban Installer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v167:
    if: github.event.pull_request.head.ref == 'agent/v1.6.7-fail2ban-installer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download V1.6.6 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.6.6 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 16' work/hyzorax-control/internal/helper/protocol.go
      - name: Apply V1.6.7
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.6.7/apply.py
          python3 release-patch/v1.6.7/apply.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/installer/*.go internal/helper/*.go internal/web/assets_test.go internal/httpapi/app_test.go
      - name: Static and security checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'Version 1.6.7' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 17' internal/helper/protocol.go
          grep -q 'func Fail2banManifest' internal/installer/builtin.go
          grep -q 'backend = systemd' internal/helper/installer_fail2ban_linux.go
          grep -q 'maxretry = 5' internal/helper/installer_fail2ban_linux.go
          grep -q 'findtime = 10m' internal/helper/installer_fail2ban_linux.go
          grep -q 'bantime = 1h' internal/helper/installer_fail2ban_linux.go
          grep -q 'banaction = nftables-multiport' internal/helper/installer_fail2ban_linux.go
          if grep -Rni --include='installer_fail2ban_linux.go' -E 'request\.Params.*(command|package|jail|action)|/bin/sh|bash -c|exec\.CommandContext\(ctx, executable' internal/helper; then
            echo 'Fail2ban installer appears to accept dynamic privileged execution' >&2
            exit 1
          fi
      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...
      - name: Real Ubuntu 24.04 Fail2ban acceptance
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=120 -y --no-install-recommends install openssh-server
          existing=false
          if dpkg-query -W -f='${Status}' fail2ban 2>/dev/null | grep -q '^install ok installed$'; then existing=true; fi
          if [[ -e /etc/fail2ban || -x /usr/bin/fail2ban-client ]]; then existing=true; fi
          if [[ "$existing" == true ]]; then
            sudo -E env HYZORAX_INSTALLER_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestFail2banRejectsExistingState$' -count=1 -v
            sudo systemctl stop fail2ban 2>/dev/null || true
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -y purge fail2ban python3-systemd nftables || true
            sudo rm -rf /etc/fail2ban
          fi
          sudo rm -f /var/lib/hyzorax-control/installer-managed/fail2ban
          sudo -E env HYZORAX_INSTALLER_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestFail2banInstallerAcceptance$' -count=1 -v
          if systemctl is-active --quiet fail2ban 2>/dev/null; then echo 'Fail2ban remained active after rollback' >&2; exit 1; fi
          if dpkg-query -W -f='${Status}' fail2ban 2>/dev/null | grep -q '^install ok installed$'; then echo 'Fail2ban package remained installed after rollback' >&2; exit 1; fi
          [[ ! -e /etc/fail2ban ]]
      - name: Build and verify V1.6.7
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.6.7
          ./build/hyzorax-control -version | grep -q '1.6.7'
          ./build/hyzorax-control-helper -version | grep -q '1.6.7'
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)
      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
      - name: Publish V1.6.7 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.6.7 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.7 HYZoraX_Control_Center_Linux_x86_64.tar.gz HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 --title 'HYZoraX Control Panel V1.6.7' --notes 'Fail2ban SSH-first clean-install acceptance for Ubuntu 24.04. Requires existing OpenSSH server, refuses existing Fail2ban/config, installs fixed fail2ban/python3-systemd/nftables packages, enables a HYZoraX-managed sshd jail using systemd backend with maxretry 5, findtime 10m, bantime 1h and nftables-multiport. Health verifies configuration, active service and sshd jail policy. OpenSSH is not modified. Rollback requires HYZoraX ownership. Helper protocol V17. hz menu unchanged; Installer browser UI not exposed.' --latest
