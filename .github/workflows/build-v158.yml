name: Build and release V1.5.8 hz username + SSH cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v158:
    if: github.event.pull_request.head.ref == 'agent/v1.5.8-hz-username-lastlog'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.5.7 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.7 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control

      - name: Apply V1.5.8
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.5.8/apply.py
          python3 release-patch/v1.5.8/apply.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/web/assets_test.go internal/httpapi/app_test.go

      - name: Static and regression checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          bash -n packaging/hyzorax-dashboard
          grep -q 'Version 1.5.8' internal/web/static/index.html
          grep -q -- '-owner-username' packaging/hz
          grep -q 'current_username' packaging/hz
          grep -q 'PrintLastLog no' packaging/bootstrap.sh
          grep -q '/etc/ssh/sshd_config.d/60-hyzorax-no-lastlog.conf' packaging/bootstrap.sh
          grep -q '/usr/sbin/sshd -t' packaging/bootstrap.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('packaging/hz').read_text()
          labels=[]
          for line in text.splitlines():
              line=line.strip()
              if line.startswith('echo "') and ') ' in line:
                  value=line[len('echo "'):-1] if line.endswith('"') else line
                  if value[:1].isdigit() or value.startswith('0)'):
                      labels.append(value)
          expected=[
              '1) Show panel Detail','2) Show service status','3) Start services',
              '4) Stop services','5) Restart services','6) Show recent logs',
              '7) Change/reset login credentials','8) Manage security entrance code',
              '9) Change panel port','10) Update Control Panel','0) Exit'
          ]
          if labels != expected:
              raise SystemExit(f'hz menu changed unexpectedly: {labels!r}')
          PY

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build and verify V1.5.8
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.5.8
          ./build/hyzorax-control -version | grep -q '1.5.8'
          ./build/hyzorax-control-helper -version | grep -q '1.5.8'
          grep -q -- '-owner-username' build/hz
          grep -q 'PrintLastLog no' build/bootstrap.sh
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.5.8 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.5.8 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.5.8 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.5.8' \
            --notes 'Targeted SSH/CLI polish release. hz 1 now resolves the current configured Owner username live instead of showing unavailable when the old credentials cache is empty/stale. Fresh installs and upgrades install a validated HYZoraX-managed sshd drop-in with PrintLastLog no, removing the OpenSSH Last login line while leaving authentication policy untouched. No hz menu entries were added or removed. Helper protocol remains V10.' \
            --latest
