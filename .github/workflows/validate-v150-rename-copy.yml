name: Validate V1.5.0 rename and copy

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'issues' || github.event.issue.title == 'HYZoraX V1.5.0 Rename Copy Validation Trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.4.4 source release
        run: |
          set -Eeuo pipefail
          mkdir -p work
          curl -fL --retry 3 \
            https://github.com/hyzorax/hyzorax-control-center/releases/download/v1.4.4/HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            -o /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control

      - name: Reassemble V1.5.0 patches
        run: |
          set -Eeuo pipefail
          base64 -d release-patch/v1.5.0/guarded-rename.patch.gz.b64 > /tmp/rename.patch.gz
          gzip -dc /tmp/rename.patch.gz > /tmp/rename.patch
          base64 -d release-patch/v1.5.0/guarded-copy.patch.gz.b64 > /tmp/copy.patch.gz
          gzip -dc /tmp/copy.patch.gz > /tmp/copy.patch
          test -s /tmp/rename.patch
          test -s /tmp/copy.patch
          grep -q 'RENAME_NOREPLACE' /tmp/rename.patch
          grep -q 'filesystemCopy' /tmp/copy.patch
          grep -q 'copy_too_large' /tmp/copy.patch

      - name: Apply guarded rename then guarded copy
        run: |
          set -Eeuo pipefail
          patch --batch -p1 -d work/hyzorax-control < /tmp/rename.patch
          patch --batch -p1 -d work/hyzorax-control < /tmp/copy.patch

      - name: Static syntax and feature checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          gofmt -w internal/helper/filesystem_linux.go internal/helper/filesystem_linux_test.go internal/helper/protocol.go internal/helper/server_linux.go internal/httpapi/app.go internal/httpapi/app_test.go internal/httpapi/files_test.go internal/httpapi/handlers.go internal/web/assets_test.go
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hyzorax-control-tls
          bash -n packaging/hyzorax-control-updater
          bash -n packaging/hz
          grep -q 'const ProtocolVersion = 6' internal/helper/protocol.go
          grep -q 'RENAME_NOREPLACE' internal/helper/filesystem_linux.go
          grep -q 'filesystem.rename' internal/helper/server_linux.go
          grep -q 'filesystem.copy' internal/helper/server_linux.go
          grep -q 'maxCopyBytes' internal/helper/filesystem_linux.go
          grep -q 'maxCopyEntries' internal/helper/filesystem_linux.go
          grep -q 'api/v1/files/rename' internal/web/static/app.js
          grep -q 'api/v1/files/copy' internal/web/static/app.js
          grep -q 'copy-dialog' internal/web/static/index.html
          grep -q 'Version 1.5.0' internal/web/static/index.html

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build validation package
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.5.0
          ./build/hyzorax-control -version | grep -q '1.5.0'
          ./build/hyzorax-control-helper -version | grep -q '1.5.0'
          (cd build && sha256sum -c SHA256SUMS)

      - name: Record successful validation
        if: success()
        run: |
          set -Eeuo pipefail
          mkdir -p release-status
          {
            echo 'status=success'
            echo 'version=1.5.0'
            echo 'features=guarded-rename,guarded-copy'
            echo 'helper_protocol=6'
            echo "validated_commit=${GITHUB_SHA}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-status/v1.5.0-rename-copy-validation.txt
          rm -f release-status/v1.5.0-rename-copy-validation-failed.txt
          git config user.name 'HYZoraX Validation Bot'
          git config user.email 'validation-bot@hyzorax.invalid'
          git add release-status/v1.5.0-rename-copy-validation.txt release-status/v1.5.0-rename-copy-validation-failed.txt 2>/dev/null || true
          git commit -m 'Record V1.5.0 rename copy validation' || exit 0
          git push

      - name: Record failed validation
        if: failure()
        run: |
          set +e
          mkdir -p release-status
          {
            echo 'status=failed'
            echo 'version=1.5.0'
            echo 'features=guarded-rename,guarded-copy'
            echo 'helper_protocol=6'
            echo "validated_commit=${GITHUB_SHA}"
            echo "failed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-status/v1.5.0-rename-copy-validation-failed.txt
          git config user.name 'HYZoraX Validation Bot'
          git config user.email 'validation-bot@hyzorax.invalid'
          git add release-status/v1.5.0-rename-copy-validation-failed.txt
          git commit -m 'Record failed V1.5.0 rename copy validation' || exit 0
          git push || true
