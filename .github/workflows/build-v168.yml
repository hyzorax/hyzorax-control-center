name: Build and release V1.6.8 Applications UI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v168:
    if: github.event.pull_request.head.ref == 'agent/v1.6.8-services-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download V1.6.7 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.6.7 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 17' work/hyzorax-control/internal/helper/protocol.go
      - name: Apply V1.6.8
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.6.8/ui_scroll_fix.py release-patch/v1.6.8/applications_ui.py
          python3 release-patch/v1.6.8/ui_scroll_fix.py work/hyzorax-control
          python3 release-patch/v1.6.8/applications_ui.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/httpapi/app.go internal/httpapi/applications.go internal/httpapi/applications_test.go internal/web/assets_test.go internal/httpapi/app_test.go
      - name: Static and scope checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'Version 1.6.8' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 17' internal/helper/protocol.go
          grep -q 'href="#applications" data-view="applications"' internal/web/static/index.html
          if grep -F 'Applications <em>Soon</em>' internal/web/static/index.html; then echo 'Applications is still marked Soon' >&2; exit 1; fi
          grep -q 'href="#services"><span>◉</span>Services <em>Soon</em>' internal/web/static/index.html
          grep -q 'id="applications-view"' internal/web/static/index.html
          grep -q 'id="node24-install-button"' internal/web/static/index.html
          grep -q 'id="composer-install-button"' internal/web/static/index.html
          grep -q 'GET /api/v1/applications/status' internal/httpapi/app.go
          grep -q 'POST /api/v1/applications/node24/install' internal/httpapi/app.go
          grep -q 'POST /api/v1/applications/composer/install' internal/httpapi/app.go
          grep -q 'installer.node24.install' internal/httpapi/applications.go
          grep -q 'installer.composer.install' internal/httpapi/applications.go
          grep -q 'Timeout: 12 \* time.Minute' internal/httpapi/applications.go
          grep -q 'overflow-y:auto' internal/web/static/app.css
          grep -q 'scrollbar-gutter:stable' internal/web/static/app.css
          grep -q 'viewFromHash' internal/web/static/app.js
          grep -q 'loadApplications' internal/web/static/app.js
          if grep -Rni --include='applications.go' -E 'exec\.Command|/bin/sh|bash -c|request\.(URL|Body).*Action' internal/httpapi; then
            echo 'Applications API must not introduce direct privileged execution or dynamic helper actions' >&2
            exit 1
          fi
      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...
      - name: Build and verify V1.6.8
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.6.8
          ./build/hyzorax-control -version | grep -q '1.6.8'
          ./build/hyzorax-control-helper -version | grep -q '1.6.8'
          grep -q 'const ProtocolVersion = 17' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)
      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
      - name: Publish V1.6.8 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.6.8 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.8 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.6.8' \
            --notes 'V1.6.8 activates the Applications workspace for Node.js 24 LTS and Composer using the existing accepted privileged installer actions, adds live Installed / Not installed / dependency / conflict state, guarded panel-native Install actions, and fixes the editor left file-tree vertical/horizontal scrolling. Composer remains blocked with a clear PHP 8.4 dependency message until that dependency exists; V1.6.8 does not silently install PHP. Services and Databases remain Soon. Helper protocol remains V17 and the hz menu is unchanged.' \
            --latest
