name: Validate and release V1.5.0 rename copy move

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  validate-release:
    if: github.event_name != 'issues' || github.event.issue.title == 'HYZoraX V1.5.0 Rename Copy Move Validation Trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.4.4 source release
        run: |
          set -Eeuo pipefail
          echo download-base > /tmp/hyzorax-v150-stage
          mkdir -p work
          curl -fL --retry 3 \
            https://github.com/hyzorax/hyzorax-control-center/releases/download/v1.4.4/HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            -o /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control

      - name: Reassemble V1.5.0 patches
        run: |
          set -Eeuo pipefail
          echo reassemble-patches > /tmp/hyzorax-v150-stage
          for feature in rename copy move; do
            base64 -d "release-patch/v1.5.0/guarded-${feature}.patch.gz.b64" > "/tmp/${feature}.patch.gz"
            gzip -dc "/tmp/${feature}.patch.gz" > "/tmp/${feature}.patch"
            test -s "/tmp/${feature}.patch"
          done
          grep -q 'RENAME_NOREPLACE' /tmp/rename.patch
          grep -q 'filesystemCopy' /tmp/copy.patch
          grep -q 'copy_too_large' /tmp/copy.patch
          grep -q 'filesystemMove' /tmp/move.patch
          grep -q 'cross_filesystem_move_denied' /tmp/move.patch
          grep -q '"syscall"' release-patch/v1.5.0/guarded-move-test-import.patch

      - name: Apply V1.5.0 guarded patches
        run: |
          set -Eeuo pipefail
          echo apply-patches > /tmp/hyzorax-v150-stage
          {
            patch --batch -p1 -d work/hyzorax-control < /tmp/rename.patch
            patch --batch -p1 -d work/hyzorax-control < /tmp/copy.patch
            patch --batch -p1 -d work/hyzorax-control < /tmp/move.patch
            patch --batch -p1 -d work/hyzorax-control < release-patch/v1.5.0/guarded-move-test-import.patch
          } 2>&1 | tee /tmp/patch.log

      - name: Static syntax and feature checks
        run: |
          set -Eeuo pipefail
          echo static-checks > /tmp/hyzorax-v150-stage
          cd work/hyzorax-control
          {
            gofmt -w internal/helper/filesystem_linux.go internal/helper/filesystem_linux_test.go internal/helper/protocol.go internal/helper/server_linux.go internal/httpapi/app.go internal/httpapi/app_test.go internal/httpapi/files_test.go internal/httpapi/handlers.go internal/web/assets_test.go
            node --check internal/web/static/app.js
            bash -n packaging/bootstrap.sh
            bash -n packaging/hyzorax-control-tls
            bash -n packaging/hyzorax-control-updater
            bash -n packaging/hz
            grep -q 'const ProtocolVersion = 7' internal/helper/protocol.go
            grep -q 'filesystem.rename' internal/helper/server_linux.go
            grep -q 'filesystem.copy' internal/helper/server_linux.go
            grep -q 'filesystem.move' internal/helper/server_linux.go
            grep -q 'RENAME_NOREPLACE' internal/helper/filesystem_linux.go
            grep -q 'maxCopyBytes' internal/helper/filesystem_linux.go
            grep -q 'cross_filesystem_move_denied' internal/helper/filesystem_linux.go
            grep -q 'api/v1/files/rename' internal/web/static/app.js
            grep -q 'api/v1/files/copy' internal/web/static/app.js
            grep -q 'api/v1/files/move' internal/web/static/app.js
            grep -q 'move-dialog' internal/web/static/index.html
            grep -q 'Version 1.5.0' internal/web/static/index.html
          } 2>&1 | tee /tmp/static.log

      - name: Test
        run: |
          set -Eeuo pipefail
          echo go-test > /tmp/hyzorax-v150-stage
          cd work/hyzorax-control
          go test ./... 2>&1 | tee /tmp/go-test.log

      - name: Vet
        run: |
          set -Eeuo pipefail
          echo go-vet > /tmp/hyzorax-v150-stage
          cd work/hyzorax-control
          go vet ./... 2>&1 | tee /tmp/go-vet.log

      - name: Build and verify V1.5.0
        run: |
          set -Eeuo pipefail
          echo build > /tmp/hyzorax-v150-stage
          cd work/hyzorax-control
          {
            make clean
            make release VERSION=1.5.0
            ./build/hyzorax-control -version | grep -q '1.5.0'
            ./build/hyzorax-control-helper -version | grep -q '1.5.0'
            (cd build && sha256sum -c SHA256SUMS)
          } 2>&1 | tee /tmp/build.log

      - name: Package V1.5.0 assets
        if: github.event_name == 'issues'
        run: |
          set -Eeuo pipefail
          echo package > /tmp/hyzorax-v150-stage
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          cut -d' ' -f1 HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 > /tmp/v150.sha

      - name: Publish V1.5.0
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo publish > /tmp/hyzorax-v150-stage
          gh release delete v1.5.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.5.0 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.5.0' \
            --notes 'File Manager guarded operations release: safe Rename, recursive guarded Copy, and atomic same-filesystem Move. Rename/Move use RENAME_NOREPLACE to prevent overwrites. Copy rejects symlinks, special files, mount-boundary trees, oversized copies, descendant copies, and cleans partial staging on failure. Cross-filesystem Move remains denied by design until destructive recovery/rollback is implemented. Helper protocol V7.' \
            --latest

      - name: Record successful validation and release
        if: success()
        run: |
          set -Eeuo pipefail
          mkdir -p release-status
          {
            echo 'status=success'
            echo 'version=1.5.0'
            echo 'features=guarded-rename,guarded-copy,guarded-move'
            echo 'helper_protocol=7'
            echo 'cross_filesystem_move=denied-by-design'
            echo "validated_commit=${GITHUB_SHA}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-status/v1.5.0-rename-copy-move-validation.txt
          if [[ "${GITHUB_EVENT_NAME}" == issues ]]; then
            {
              echo 'status=success'
              echo 'version=1.5.0'
              echo 'features=guarded-rename,guarded-copy,guarded-move'
              echo 'helper_protocol=7'
              echo 'cross_filesystem_move=denied-by-design'
              printf 'archive_sha256='; cat /tmp/v150.sha
              echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > release-status/v1.5.0.txt
          fi
          rm -f release-status/v1.5.0-rename-copy-move-validation-failed.txt release-status/v1.5.0-failed.txt
          git config user.name 'HYZoraX Release Bot'
          git config user.email 'release-bot@hyzorax.invalid'
          git add release-status/v1.5.0-rename-copy-move-validation.txt release-status/v1.5.0.txt release-status/v1.5.0-rename-copy-move-validation-failed.txt release-status/v1.5.0-failed.txt 2>/dev/null || true
          git commit -m 'Record V1.5.0 validated release' || exit 0
          git push

      - name: Record failed V1.5.0 run with diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p release-status
          status_file=release-status/v1.5.0-failed.txt
          {
            echo 'status=failed'
            echo 'version=1.5.0'
            printf 'failure_stage='; cat /tmp/hyzorax-v150-stage 2>/dev/null || echo unknown
            echo "failed_commit=${GITHUB_SHA}"
            echo "failed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for log in /tmp/patch.log /tmp/static.log /tmp/go-test.log /tmp/go-vet.log /tmp/build.log; do
              if [[ -s "$log" ]]; then
                echo
                echo "===== $(basename "$log") ====="
                tail -n 120 "$log"
              fi
            done
          } > "$status_file"
          git config user.name 'HYZoraX Release Bot'
          git config user.email 'release-bot@hyzorax.invalid'
          git add "$status_file"
          git commit -m 'Record failed V1.5.0 release run' || exit 0
          git push || true
