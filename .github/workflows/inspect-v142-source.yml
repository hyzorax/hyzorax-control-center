name: Inspect V1.4.2 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v142-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download V1.4.2 release
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/hyz-src
          curl -fL --retry 3 \
            https://github.com/hyzorax/hyzorax-control-center/releases/download/v1.4.2/HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            -o /tmp/v142.tar.gz
          tar -xzf /tmp/v142.tar.gz -C /tmp/hyz-src
          test -d /tmp/hyz-src/hyzorax-control

      - name: Build source snapshot
        run: |
          set -Eeuo pipefail
          cd /tmp/hyz-src/hyzorax-control
          OUT="$GITHUB_WORKSPACE/source-snapshot-v142.txt"
          : > "$OUT"
          echo '========== TREE ==========' >> "$OUT"
          find . -maxdepth 4 -type f \( -name '*.go' -o -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.sh' -o -name '*.toml' -o -name 'Makefile' \) | sort >> "$OUT"
          echo >> "$OUT"
          for f in \
            packaging/bootstrap.sh \
            packaging/hz \
            packaging/hyzorax-control-tls \
            packaging/hyzorax-control-updater \
            internal/web/static/app.js \
            internal/web/static/app.css \
            internal/web/static/styles.css \
            internal/web/templates/login.html \
            internal/web/templates/index.html \
            internal/web/templates/app.html; do
            if [ -f "$f" ]; then
              echo "========== FILE: $f ==========" >> "$OUT"
              cat "$f" >> "$OUT"
              echo >> "$OUT"
            fi
          done

      - name: Commit snapshot
        run: |
          set -Eeuo pipefail
          git config user.name 'hyzorax'
          git config user.email 'hyzorax@gmail.com'
          git add source-snapshot-v142.txt
          git commit -m 'Snapshot V1.4.2 source for consolidated polish' || exit 0
          git push
