name: Build and release V1.4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v142.yml'
      - 'release-patch/v1.4.2.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.4.1 source release
        run: |
          set -Eeuo pipefail
          mkdir -p work
          curl -fL --retry 3 \
            https://github.com/hyzorax/hyzorax-control-center/releases/download/v1.4.1/HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            -o /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control

      - name: Reassemble and apply V1.4.2 patch
        run: |
          set -Eeuo pipefail
          cat release-patch/v1.4.2.part00 \
              release-patch/v1.4.2.part01 \
              release-patch/v1.4.2.part02 \
              release-patch/v1.4.2.part03 \
              release-patch/v1.4.2.part04 \
              release-patch/v1.4.2.part05 \
              release-patch/v1.4.2.part06 \
              release-patch/v1.4.2.part07 \
            > /tmp/v142.b64
          base64 -d /tmp/v142.b64 > /tmp/v142-patch.tar.gz
          echo 'bd905b17c3facf93955640e2d912b267091ca6b3081234de787b73456ab8744e  /tmp/v142-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v142-patch.tar.gz -C work/hyzorax-control

      - name: Static syntax checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          bash -n packaging/bootstrap.sh
          bash -n packaging/hyzorax-control-tls
          bash -n packaging/hyzorax-control-updater
          bash -n packaging/hz
          node --check internal/web/static/app.js

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build release
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.4.2
          ./build/hyzorax-control -version
          ./build/hyzorax-control-helper -version
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package stable assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.4.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.2 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Center V1.4.2' \
            --notes 'Final manual-update bridge release: 1-second live dashboard, panel self-update, mixed 8-character security entrance, one-shot hz menu, immediate trusted IP TLS bootstrap, Owner detail display, and HYZORAX TLS banner.' \
            --latest

      - name: Record successful release
        run: |
          set -Eeuo pipefail
          mkdir -p release-status
          {
            echo 'version=1.4.2'
            echo "archive_sha256=$(sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz | awk '{print $1}')"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-status/v1.4.2.txt
          git config user.name 'HYZoraX Release Bot'
          git config user.email 'release-bot@hyzorax.invalid'
          git add release-status/v1.4.2.txt
          git commit -m 'Record successful V1.4.2 release'
          git push origin HEAD:main
