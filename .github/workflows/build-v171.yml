name: Build and release V1.7.1 SSH Security controls

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v171:
    if: github.event.pull_request.head.ref == 'agent/v1.7.1-ssh-security-controls'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.7.0 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.7.0 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 18' work/hyzorax-control/internal/helper/protocol.go
          grep -q 'Version 1.7.0' work/hyzorax-control/internal/web/static/index.html

      - name: Apply V1.7.1
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.7.1/ssh_security.py release-patch/v1.7.1/fix_root_equivalence.py release-patch/v1.7.1/fix_acceptance.py
          python3 release-patch/v1.7.1/ssh_security.py work/hyzorax-control
          python3 release-patch/v1.7.1/fix_root_equivalence.py work/hyzorax-control
          python3 release-patch/v1.7.1/fix_acceptance.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/helper/protocol.go internal/helper/server_linux.go internal/helper/security_linux.go internal/helper/security_linux_test.go internal/helper/security_ssh_acceptance_test.go internal/httpapi/app.go internal/httpapi/security.go internal/httpapi/app_test.go internal/web/assets_test.go

      - name: Static security and UI checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'const ProtocolVersion = 19' internal/helper/protocol.go
          grep -q 'case "security.ssh.apply"' internal/helper/server_linux.go
          grep -q 'securitySSHManagedPath = "/etc/ssh/sshd_config.d/10-hyzorax-security.conf"' internal/helper/security_linux.go
          grep -q 'DisallowUnknownFields' internal/helper/security_linux.go
          grep -q 'ssh_lockout_risk' internal/helper/security_linux.go
          grep -q 'root_key_detected' internal/helper/security_linux.go
          grep -q 'securityRootPolicyEquivalent' internal/helper/security_linux.go
          grep -q '"all_interfaces"' internal/helper/security_linux.go
          grep -q 'POST /api/v1/security/ssh/apply' internal/httpapi/app.go
          grep -q 'Action:[[:space:]]*"security.ssh.apply"' internal/httpapi/security.go
          grep -q 'id="security-ssh-manage"' internal/web/static/index.html
          grep -q 'id="security-ssh-dialog"' internal/web/static/index.html
          grep -q 'All interfaces' internal/web/static/index.html
          grep -q 'GUARDED SECURITY' internal/web/static/index.html
          grep -q 'Version 1.7.1' internal/web/static/index.html
          grep -q 'api/v1/security/ssh/apply' internal/web/static/app.js
          grep -q 'Root key not detected' internal/web/static/app.js
          grep -q 'All interfaces' internal/web/static/app.js
          grep -q 'href="#services"><span>◉</span>Services <em>Soon</em>' internal/web/static/index.html
          grep -q 'href="#databases"><span>▥</span>Databases <em>Soon</em>' internal/web/static/index.html
          if grep -Rni -E 'bash -c|sh -c|/bin/bash|/bin/sh' internal/helper/security_linux.go internal/httpapi/security.go; then
            echo 'SSH Security controls must not introduce shell-command execution.' >&2
            exit 1
          fi
          if grep -Rni -E 'systemctl.*(stop|disable)|ssh\.service.*stop|sshd\.service.*stop' internal/helper/security_linux.go; then
            echo 'SSH Security controls must not stop/disable SSH.' >&2
            exit 1
          fi
          if grep -Rni -E 'request\.(Target|Params).*(command|path|service)' internal/helper/security_linux.go internal/httpapi/security.go; then
            echo 'SSH Security controls must not accept arbitrary privileged targets.' >&2
            exit 1
          fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Real Ubuntu 24.04 SSH safety acceptance
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=120 -y --no-install-recommends install openssh-server
          sudo mkdir -p /run/sshd /root/.ssh
          sudo chmod 0700 /root/.ssh
          sudo systemctl enable --now ssh.service
          had_keys=false
          if sudo test -f /root/.ssh/authorized_keys; then
            had_keys=true
            sudo cp -a /root/.ssh/authorized_keys /tmp/hyzorax-root-authorized_keys.backup
          fi
          ssh-keygen -q -t ed25519 -N '' -f /tmp/hyzorax-v171-key
          sudo cp /tmp/hyzorax-v171-key.pub /root/.ssh/authorized_keys
          sudo chmod 0600 /root/.ssh/authorized_keys
          cleanup() {
            if [[ "$had_keys" == true ]]; then sudo cp -a /tmp/hyzorax-root-authorized_keys.backup /root/.ssh/authorized_keys; else sudo rm -f /root/.ssh/authorized_keys; fi
            sudo /usr/sbin/sshd -t || true
            sudo systemctl reload ssh.service 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo -E env HYZORAX_SECURITY_SSH_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestSecuritySSHApplyAcceptance$' -count=1 -v
          sudo /usr/sbin/sshd -t
          systemctl is-active --quiet ssh.service

      - name: Build and verify V1.7.1
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.7.1
          ./build/hyzorax-control -version | grep -q '1.7.1'
          ./build/hyzorax-control-helper -version | grep -q '1.7.1'
          grep -q 'const ProtocolVersion = 19' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.7.1 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.7.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.7.1 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.7.1' \
            --notes 'V1.7.1 advances P7 Security Center with guarded SSH controls. Wildcard listeners are now described accurately as All interfaces rather than Public. The oversized read-only intro is replaced by a compact guarded-security header. SSH Management can control root login between Password + keys and Keys only, and enable/disable PasswordAuthentication. Restrictive changes are refused unless a root authorized key is detected and public-key authentication is active. HYZoraX writes only its own /etc/ssh/sshd_config.d/10-hyzorax-security.conf, validates with sshd -t, reloads without stopping active SSH sessions, verifies effective settings including equivalent OpenSSH root-login aliases, and automatically restores the previous file on validation/reload/override failure. A real Ubuntu 24.04 OpenSSH harden/restore acceptance test is required. Helper protocol V19; hz menu unchanged; Firewall and Fail2ban write controls remain for later P7 slices.' \
            --latest
