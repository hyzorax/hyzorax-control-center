name: Inspect V1.6.8 UI for V1.6.9

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/v1.6.9-ui-refine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.6.8 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.6.8 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
      - name: Inspect applications and editor UI
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== APPLICATIONS HTML ====='
          sed -n '35,180p' internal/web/static/index.html
          echo '===== EDITOR HTML MARKERS ====='
          grep -n -B25 -A90 -E 'editor-dialog|editor-workspace|editor-tree|editor-tabs|editor-textarea|editor-save' internal/web/static/index.html | head -n 420 || true
          echo '===== APPLICATIONS CSS ====='
          grep -n -B5 -A80 -E 'applications-view|application-card|application-grid|application-status' internal/web/static/app.css | head -n 420 || true
          echo '===== EDITOR CSS ====='
          grep -n -B5 -A120 -E 'editor-dialog|editor-workspace|editor-tree|editor-tabs|editor-code|editor-status|editor-toolbar' internal/web/static/app.css | head -n 520 || true
          echo '===== EDITOR JS ====='
          grep -n -B8 -A70 -E 'openTextEditor|loadEditor|editorTree|saveEditor|editor-save|editor-tabs|editor-text' internal/web/static/app.js | head -n 620 || true
