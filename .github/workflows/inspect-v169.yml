name: Inspect V1.6.8 UI for V1.6.9

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/v1.6.9-ui-refine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.6.8 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.6.8 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
      - name: Inspect editor save and dialog wiring
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== EDITOR FUNCTIONS ====='
          sed -n '575,625p' internal/web/static/app.js
          echo '===== EDITOR EVENT WIRING ====='
          sed -n '730,900p' internal/web/static/app.js
          echo '===== DIALOG HELPERS ====='
          grep -n -B5 -A35 -E 'function openDialog|function closeDialog|data-close-dialog' internal/web/static/app.js | head -n 260 || true
