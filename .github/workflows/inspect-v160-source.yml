name: Inspect V1.5.8 source for V1.6.0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-v160:
    if: github.event.pull_request.head.ref == 'agent/v1.6.0-installer-engine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.5.8 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.8 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
      - name: Inspect installer, store and API internals
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== internal/installer ====='
          find internal/installer -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1"; sed -n "1,320p" "$1"' _ {} \;
          echo '===== store schema/migrations ====='
          grep -Rni -C 5 -E 'CREATE TABLE|schema|migration|audit|job|installer' internal/store | head -n 900 || true
          echo '===== httpapi routes/handlers ====='
          grep -Rni -C 5 -E 'installer|job|progress|audit' internal/httpapi | head -n 900 || true
          echo '===== helper protocol ====='
          grep -Rni -C 5 -E 'Action|protocol|install|package|apt' internal/helper | head -n 700 || true
          echo '===== build/version ====='
          grep -n -C 3 -E 'VERSION|Version 1.5.8|release' Makefile internal/web/static/index.html internal/web/assets_test.go | head -n 250 || true
