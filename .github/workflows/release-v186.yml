name: Validate and publish V1.8.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v185.yml"
  pull_request:
    branches: [main]
    paths:
      - "release-patch/v1.8.6/**"
      - ".github/workflows/release-v185.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified V1.8.6 GitHub release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: v1.8.6-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: "1.8.6"
  BASE_TAG: "v1.8.5"
  ARCHIVE: "HYZoraX_Control_Center_Linux_x86_64.tar.gz"
  BASE_SHA256: "aa56c864c286da2f4ce615b81e1f44bf4e35721d5ab4af61cbdeb493a4cea2ba"
  PATCH_FILE: "release-patch/v1.8.6/software_table.py"
  PATCH_SHA256: "0f3ed897a33bcb7e85edf6213cbc2548f244e9e4cb619d795d22b0b8ceb03eca"

jobs:
  validate-build-publish:
    name: Reconstruct, validate, build, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Download and authenticate V1.8.4 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf -- _release-work
          mkdir -p _release-work/base
          gh release download "$BASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir _release-work \
            --pattern "$ARCHIVE" \
            --pattern "$ARCHIVE.sha256"
          echo "$BASE_SHA256  _release-work/$ARCHIVE" | sha256sum -c -
          (cd _release-work && sha256sum -c "$ARCHIVE.sha256")
          tar -xzf "_release-work/$ARCHIVE" -C _release-work/base
          source_dir="$(find _release-work/base -type f -name go.mod -printf '%h\n' -quit)"
          test -n "$source_dir"
          printf '%s\n' "$source_dir" > _release-work/source-path
          grep -F "Version 1.8.4" "$source_dir/internal/web/static/index.html"
          grep -F "const ProtocolVersion = 21" "$source_dir/internal/helper/protocol.go"

      - name: Authenticate and apply V1.8.6 compact software catalogue patch
        run: |
          set -Eeuo pipefail
          echo "$PATCH_SHA256  $PATCH_FILE" | sha256sum -c -
          python3 -m py_compile "$PATCH_FILE"
          source_dir="$(cat _release-work/source-path)"
          python3 "$PATCH_FILE" "$source_dir"

      - name: Verify authenticated files and release invariants
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          python3 - "$PATCH_FILE" "$source_dir" <<'PY'
          import hashlib
          import importlib.util
          import pathlib
          import sys

          spec = importlib.util.spec_from_file_location("v185_patch", sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          root = pathlib.Path(sys.argv[2])
          for relative, metadata in module.FILES.items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              if actual != metadata["after"]:
                  raise SystemExit(f"authenticated file mismatch: {relative}")
          print(f"verified {len(module.FILES)} authenticated V1.8.6 files")
          PY
          grep -F "Version 1.8.6" "$source_dir/internal/web/static/index.html"
          grep -F "const ProtocolVersion = 22" "$source_dir/internal/helper/protocol.go"
          grep -F 'data-view="services"' "$source_dir/internal/web/static/index.html"
          grep -F 'id="services-view"' "$source_dir/internal/web/static/index.html"
          grep -F 'id="service-logs-dialog"' "$source_dir/internal/web/static/index.html"
          grep -F 'GET /api/v1/services/status' "$source_dir/internal/httpapi/app.go"
          grep -F 'GET /api/v1/services/logs' "$source_dir/internal/httpapi/app.go"
          grep -F 'POST /api/v1/services/apply' "$source_dir/internal/httpapi/app.go"
          grep -F '"hyzorax-control-helper.service"' "$source_dir/cmd/hyzorax-control-helper/main.go"
          grep -F '"/usr/bin/systemctl", input.Operation, "--", unit' "$source_dir/internal/helper/services_linux.go"
          grep -F '"--lines=120"' "$source_dir/internal/helper/services_linux.go"
          grep -F 'context.WithTimeout(context.Background(), 20*time.Second)' "$source_dir/internal/helper/services_linux.go"
          grep -F 'service.%' "$source_dir/internal/store/store.go"
          grep -F 'showPanelConfirmation' "$source_dir/internal/web/static/app.js"
          grep -F 'scheduleServicesLive' "$source_dir/internal/web/static/app.js"
          grep -F '.service-card[data-busy="true"]' "$source_dir/internal/web/static/app.css"
          grep -F '<span>Software name</span><span>Developer</span><span>Instructions</span>' "$source_dir/internal/web/static/index.html"
          grep -F 'class="software-developer">Official' "$source_dir/internal/web/static/index.html"
          grep -F 'V1.8.6 — compact software catalogue' "$source_dir/internal/web/static/app.css"
          grep -F 'overflow-x:auto!important' "$source_dir/internal/web/static/app.css"
          grep -F 'installed_version_file="/var/lib/hyzorax-control/installed-version"' "$source_dir/packaging/bootstrap.sh"
          grep -F 'current_version="${completed_version}"' "$source_dir/packaging/hyzorax-control-updater"
          test "$(grep -o 'id="[^"]*"' "$source_dir/internal/web/static/index.html" | sort | uniq -d | wc -l)" -eq 0

      - name: Run static checks
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh packaging/hyzorax-control-tls packaging/hyzorax-control-updater packaging/hyzorax-dashboard packaging/hz

      - name: Run Go tests, race checks, and vet
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          go test ./...
          go test -race ./internal/config ./internal/cryptoutil ./internal/helper ./internal/httpapi ./internal/installer ./internal/store ./internal/web
          go vet ./...

      - name: Exercise inherited Services Manager against systemd
        run: |
          set -Eeuo pipefail
          test -d /run/systemd/system
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          go test -c -o "$RUNNER_TEMP/hyzorax-services-acceptance.test" ./internal/helper
          sudo env HYZORAX_SYSTEMD_SERVICES_ACCEPTANCE=1 \
            "$RUNNER_TEMP/hyzorax-services-acceptance.test" \
            -test.run '^TestSystemdServicesAcceptance$' -test.count=1 -test.v \
            | tee "$RUNNER_TEMP/services-acceptance.log"
          grep -F -- "--- PASS: TestSystemdServicesAcceptance" "$RUNNER_TEMP/services-acceptance.log"

      - name: Build authenticated V1.8.6 bundle
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          rm -f -- build/hyzorax-control build/hyzorax-control-helper build/SHA256SUMS
          make release VERSION="$VERSION"
          test "$(./build/hyzorax-control -version)" = "hyzorax-control $VERSION"
          test "$(./build/hyzorax-control-helper -version)" = "hyzorax-control-helper $VERSION"
          (cd build && sha256sum --check --strict SHA256SUMS)

      - name: Package and validate installer-compatible archive
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          mkdir -p _release-work/package/hyzorax-control
          cp -a "$source_dir/." _release-work/package/hyzorax-control/
          tar -C _release-work/package -czf "_release-work/$ARCHIVE" hyzorax-control
          (cd _release-work && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          (cd _release-work && sha256sum -c "$ARCHIVE.sha256")
          mkdir -p _release-work/package-check
          tar -xzf "_release-work/$ARCHIVE" -C _release-work/package-check
          packaged_root="_release-work/package-check/hyzorax-control"
          test -f "$packaged_root/go.mod"
          test -f "$packaged_root/build/SHA256SUMS"
          test -x "$packaged_root/build/hyzorax-control"
          test -x "$packaged_root/build/hyzorax-control-helper"
          test -x "$packaged_root/build/bootstrap.sh"
          (cd "$packaged_root/build" && sha256sum --check --strict SHA256SUMS)
          test "$("$packaged_root/build/hyzorax-control" -version)" = "hyzorax-control $VERSION"
          test "$("$packaged_root/build/hyzorax-control-helper" -version)" = "hyzorax-control-helper $VERSION"
          grep -F "Version 1.8.6" "$packaged_root/internal/web/static/index.html"
          grep -F "const ProtocolVersion = 22" "$packaged_root/internal/helper/protocol.go"

      - name: Publish V1.8.6 release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            "_release-work/$ARCHIVE" \
            "_release-work/$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HYZoraX Control Center V1.8.6" \
            --notes "V1.8.6 redesigns Applications as a compact desktop software catalogue with clear Software, Developer, Instructions, Target, Installed, Status, and Action columns. It retains guarded installers, live filters, responsive mobile rows, the V1.8.5 Services Manager, update-recovery safeguards, and the HYZoraX aqua-to-royal-blue brand system."

      - name: Verify published release and assets
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p _release-work/published _release-work/published-check
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir _release-work/published --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          (cd _release-work/published && sha256sum -c "$ARCHIVE.sha256")
          tar -xzf "_release-work/published/$ARCHIVE" -C _release-work/published-check
          published_root="_release-work/published-check/hyzorax-control"
          test -f "$published_root/go.mod"
          (cd "$published_root/build" && sha256sum --check --strict SHA256SUMS)
          test "$("$published_root/build/hyzorax-control" -version)" = "hyzorax-control $VERSION"
          test "$("$published_root/build/hyzorax-control-helper" -version)" = "hyzorax-control-helper $VERSION"
          grep -F "Version 1.8.6" "$published_root/internal/web/static/index.html"
          grep -F "const ProtocolVersion = 22" "$published_root/internal/helper/protocol.go"
          grep -F 'id="services-view"' "$published_root/internal/web/static/index.html"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url
