name: Build and release V1.6.2 PHP 8.4 Installer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v162:
    if: github.event.pull_request.head.ref == 'agent/v1.6.2-php84-installer'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download V1.6.1 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.6.1 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 11' work/hyzorax-control/internal/helper/protocol.go
      - name: Apply V1.6.2
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.6.2/apply.py
          python3 release-patch/v1.6.2/apply.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/installer/*.go internal/helper/*.go internal/web/assets_test.go internal/httpapi/app_test.go
      - name: Static and security checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'Version 1.6.2' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 12' internal/helper/protocol.go
          grep -q 'func PHP84Manifest' internal/installer/builtin.go
          grep -q 'B8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6' internal/installer/builtin.go
          grep -q 'B8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6' internal/helper/installer_php84_linux.go
          grep -q 'ppa.launchpadcontent.net/ondrej/php/ubuntu' internal/helper/installer_php84_linux.go
          grep -q 'installer.php84.preflight' internal/helper/server_linux.go
          grep -q 'installer.php84.install' internal/helper/server_linux.go
          grep -q 'installer.php84.health' internal/helper/server_linux.go
          grep -q 'installer.php84.rollback' internal/helper/server_linux.go
          grep -q '/run/php/php8.4-fpm.sock' internal/helper/installer_php84_linux.go
          grep -q 'public_listener.*false' internal/helper/installer_php84_linux.go
          if grep -Rni --include='*.go' -E 'request\.Params.*(package|repository|command)|exec\.CommandContext\(ctx, executable|/bin/sh|bash -c' internal/helper/installer_php84_linux.go; then
            echo 'PHP 8.4 installer appears to accept dynamic command/repository execution' >&2
            exit 1
          fi
      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...
      - name: Real Ubuntu 24.04 PHP 8.4 acceptance
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          existing=false
          if [[ -x /usr/bin/php8.4 || -x /usr/sbin/php-fpm8.4 || -e /etc/php/8.4 ]]; then existing=true; fi
          if grep -Rqs 'ppa.launchpadcontent.net/ondrej/php/ubuntu' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then existing=true; fi
          if [[ "${existing}" == true ]]; then
            echo 'Runner has existing PHP 8.4/PPA state; first verify HYZoraX refuses to overwrite/adopt it.'
            sudo -E env HYZORAX_INSTALLER_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestPHP84InstallerRejectsExistingState$' -count=1 -v
            if command -v add-apt-repository >/dev/null 2>&1; then
              sudo add-apt-repository --yes --remove ppa:ondrej/php >/dev/null 2>&1 || true
            fi
            mapfile -t installed_php84 < <(dpkg-query -W -f='${binary:Package}\t${Status}\n' 'php8.4*' 2>/dev/null | awk '$2=="install" && $3=="ok" && $4=="installed" {print $1}' | grep -E '^php8\.4[-A-Za-z0-9.+:]*$' || true)
            if (( ${#installed_php84[@]} > 0 )); then
              sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=120 -y purge "${installed_php84[@]}"
            fi
            sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update
          fi
          if [[ -x /usr/bin/php8.4 || -x /usr/sbin/php-fpm8.4 || -e /etc/php/8.4 ]]; then
            echo 'Disposable runner still has PHP 8.4 state after package cleanup; refusing manual deletion.' >&2
            exit 1
          fi
          if grep -Rqs 'ppa.launchpadcontent.net/ondrej/php/ubuntu' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo 'Disposable runner still has Ondrej PHP repository after cleanup.' >&2
            exit 1
          fi
          sudo -E env HYZORAX_INSTALLER_ACCEPTANCE=1 "$(command -v go)" test -tags=integration ./internal/helper -run '^TestPHP84InstallerAcceptance$' -count=1 -v
          if [[ -x /usr/bin/php8.4 || -x /usr/sbin/php-fpm8.4 || -e /etc/php/8.4 ]]; then
            echo 'PHP 8.4 remained installed/configured after acceptance rollback.' >&2
            exit 1
          fi
          if systemctl is-active --quiet php8.4-fpm 2>/dev/null; then
            echo 'PHP 8.4 FPM remained active after acceptance rollback.' >&2
            exit 1
          fi
          if grep -Rqs 'ppa.launchpadcontent.net/ondrej/php/ubuntu' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo 'Ondrej PHP repository remained configured after acceptance rollback.' >&2
            exit 1
          fi
      - name: Build and verify V1.6.2
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.6.2
          ./build/hyzorax-control -version | grep -q '1.6.2'
          ./build/hyzorax-control-helper -version | grep -q '1.6.2'
          grep -q 'const ProtocolVersion = 12' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)
      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
      - name: Publish V1.6.2 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.6.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.2 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.6.2' \
            --notes 'PHP 8.4 FPM core-installer acceptance for Ubuntu 24.04. Because Noble defaults to PHP 8.3, this installer uses the fixed Ondrej PHP PPA and verifies its Launchpad signing fingerprint B8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6 before installing a fixed PHP 8.4 package/extension set. Clean-install mode refuses existing PHP 8.4, /etc/php/8.4, or an existing Ondrej PHP source. Health requires php-fpm8.4 -t, active php8.4-fpm, the expected Unix socket /run/php/php8.4-fpm.sock, no public FPM listener, PHP 8.4 CLI and required modules. Acceptance performs real repository/package install and rollback on disposable Ubuntu 24.04. Helper protocol V12. No new hz menu entry and no browser Installer UI is exposed yet.' \
            --latest
