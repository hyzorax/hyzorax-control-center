name: Build and release V1.5.7 Workspace + First Run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v157:
    if: github.event.pull_request.head.ref == 'agent/v1.5.7-editor-workspace'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.5.6 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.6 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha

      - name: Apply V1.5.7
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.5.7/apply.py
          python3 release-patch/v1.5.7/apply.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w cmd/hyzorax-control/main.go cmd/hyzorax-control/main_test.go internal/store/store.go internal/httpapi/app.go internal/httpapi/handlers.go internal/httpapi/middleware.go internal/httpapi/app_test.go internal/installer/plan.go internal/installer/plan_test.go
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"

      - name: Static and security checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hyzorax-dashboard
          bash -n packaging/hyzorax-control-tls
          bash -n packaging/hyzorax-control-updater
          bash -n packaging/hz
          grep -q 'Version 1.5.7' internal/web/static/index.html
          grep -q 'id="setup-form"' internal/web/static/index.html
          grep -q 'Remember me' internal/web/static/index.html
          grep -q 'GET /api/v1/auth/setup/status' internal/httpapi/app.go
          grep -q 'POST /api/v1/auth/setup' internal/httpapi/app.go
          grep -q 'PendingOwnerPasswordHash' internal/store/store.go
          grep -q 'rememberSessionTTL' internal/httpapi/handlers.go
          grep -q 'id="editor-find-panel"' internal/web/static/index.html
          grep -q 'id="editor-replace-row"' internal/web/static/index.html
          grep -q 'id="editor-tree-content"' internal/web/static/index.html
          grep -q 'id="editor-tabs"' internal/web/static/index.html
          grep -q 'loadEditorTreeRoot' internal/web/static/app.js
          grep -q 'replaceEditorAll' internal/web/static/app.js
          grep -q 'window.addEventListener("keydown",captureEditorShortcut,true)' internal/web/static/app.js
          grep -q 'collectEditorFindMatches(true)' internal/web/static/app.js
          grep -q 'Username:' packaging/hyzorax-dashboard
          grep -q 'Panel URL:' packaging/hyzorax-dashboard
          grep -q 'Memory:' packaging/hyzorax-dashboard
          grep -q 'Reboot:' packaging/hyzorax-dashboard
          grep -q 'internal/installer' <(find internal/installer -type f)
          if grep -q 'window.confirm(' internal/web/static/app.js; then echo 'Native browser confirm regressed' >&2; exit 1; fi
          if grep -q 'Initial Owner password: ' packaging/bootstrap.sh; then echo 'Installer still exposes Owner password' >&2; exit 1; fi
          if grep -qE '^Project:|^Domain:|Foundation locked and live' packaging/hyzorax-dashboard; then echo 'Legacy dashboard field regressed' >&2; exit 1; fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build and verify V1.5.7
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.5.7
          ./build/hyzorax-control -version | grep -q '1.5.7'
          ./build/hyzorax-control-helper -version | grep -q '1.5.7'
          test -x build/hyzorax-dashboard
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.5.7 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.5.7 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.5.7 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.5.7' \
            --notes 'Editor workspace + first-run UX release. Adds side Find panel with expandable Replace, live search, lazy server file tree, multi-file editor tabs, robust editor-level Ctrl/Cmd+F capture and two-row editor controls. Fresh installs now create the Owner in one-time password-setup state; once set, all browsers use normal Sign in. Login adds Remember me with a 30-day secure sliding session. Installs a colored dynamic HYZoraX SSH dashboard showing current Username, Panel URL, auto-detected server, Disk, Memory, Uptime, IPv4 and Reboot status, with no password display. Adds the internal Installer Engine dependency/conflict planning foundation without adding any hz menu entry. Helper protocol remains V10.' \
            --latest
