name: Validate V1.7.9
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  validate-v179:
    if: github.head_ref == 'agent/v1.7.9-installer-runtime-hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download exact V1.7.8 release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v179
          gh release download v1.7.8 --repo "$GITHUB_REPOSITORY" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz*' --dir /tmp/v179
          cd /tmp/v179
          echo '60a7e1dfbf8a7ba57228f744646c9e7ac6e7443486e3db77f15ced85d7f55ae7  HYZoraX_Control_Center_Linux_x86_64.tar.gz' | sha256sum -c -
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz
          grep -Fq 'Version 1.7.8' hyzorax-control/internal/web/static/index.html
          grep -Fq 'const ProtocolVersion = 21' hyzorax-control/internal/helper/protocol.go
          sha256sum hyzorax-control/packaging/hz > base-hz.sha256
      - name: Apply checksum-guarded V1.7.9 hotfix
        run: |
          set -Eeuo pipefail
          echo '5d38f3b2910ee6018ba052d5cb21e24a34664913e3c1e7b4018830d52258b32c  release-patch/v1.7.9/installer_runtime_hotfix.py' | sha256sum -c -
          python3 -m py_compile release-patch/v1.7.9/installer_runtime_hotfix.py
          python3 release-patch/v1.7.9/installer_runtime_hotfix.py /tmp/v179/hyzorax-control
      - name: Verify installer runtime and retained browser contracts
        working-directory: /tmp/v179/hyzorax-control
        run: |
          set -Eeuo pipefail
          grep -Fq 'Version 1.7.9' internal/web/static/index.html
          grep -Fxq 'NoNewPrivileges=false' packaging/hyzorax-control-helper.service
          ! grep -Fxq 'NoNewPrivileges=true' packaging/hyzorax-control-helper.service
          grep -Fxq 'RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6' packaging/hyzorax-control-helper.service
          cmp packaging/hyzorax-control-helper.service build/hyzorax-control-helper.service
          cmp packaging/bootstrap.sh build/bootstrap.sh
          grep -Fq '20-installer-network.conf' packaging/bootstrap.sh
          grep -Fq '20-installer-runtime.conf' packaging/bootstrap.sh
          grep -Fq '21-apt-diagnostic.conf' packaging/bootstrap.sh
          grep -Fq 'Preserving unrecognized helper drop-in' packaging/bootstrap.sh
          grep -Fq "privileged helper runtime blocked APT's _apt user transition" internal/helper/installer_apt_linux.go
          grep -Fq 'server clock is behind Ubuntu repository metadata' internal/helper/installer_apt_linux.go
          grep -Fq 'TestFail2banInstallerSystemdServiceAcceptance' internal/helper/installer_fail2ban_acceptance_test.go
          grep -Fq 'const ProtocolVersion = 21' internal/helper/protocol.go
          grep -Fq 'const method = String(options.method || "GET").toUpperCase();' internal/web/static/app.js
          grep -Fq 'if (!["GET", "HEAD", "OPTIONS"].includes(method) && !headers.has("Content-Type")) headers.set("Content-Type", "application/json");' internal/web/static/app.js
          ! grep -Fq 'if (options.body && !headers.has("Content-Type"))' internal/web/static/app.js
          (cd /tmp/v179 && sha256sum -c base-hz.sha256)
      - name: Unit, integration, race and vet
        working-directory: /tmp/v179/hyzorax-control
        run: |
          set -Eeuo pipefail
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh build/bootstrap.sh packaging/hyzorax-control-updater packaging/hz
          go test ./...
          go test -tags=integration ./internal/helper
          go test -race ./internal/helper ./internal/httpapi ./internal/web
          go vet ./...
      - name: Build V1.7.9 binaries
        working-directory: /tmp/v179/hyzorax-control
        run: |
          set -Eeuo pipefail
          mkdir -p build
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.9' -o build/hyzorax-control ./cmd/hyzorax-control
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.9' -o build/hyzorax-control-helper ./cmd/hyzorax-control-helper
          test "$(build/hyzorax-control -version | awk '{print $NF}')" = '1.7.9'
          test "$(build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.9'
      - name: Packaged systemd Fail2ban installer acceptance
        working-directory: /tmp/v179/hyzorax-control
        run: |
          set -Eeuo pipefail
          diagnostics() {
            sudo systemctl status hyzorax-control-helper.service --no-pager || true
            sudo journalctl -u hyzorax-control-helper.service --no-pager -n 200 || true
          }
          trap diagnostics ERR
          sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -y --no-install-recommends install openssh-server
          sudo groupadd --system hyzorax-control
          sudo useradd --system --gid hyzorax-control --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin hyzorax-control
          sudo install -d -o root -g root -m 0755 /usr/local/libexec
          sudo install -o root -g root -m 0755 build/hyzorax-control-helper /usr/local/libexec/hyzorax-control-helper
          sudo install -o root -g root -m 0644 packaging/hyzorax-control-helper.service /etc/systemd/system/hyzorax-control-helper.service
          sudo install -o root -g root -m 0644 packaging/hyzorax-control.tmpfiles.conf /etc/tmpfiles.d/hyzorax-control.conf
          sudo systemd-tmpfiles --create /etc/tmpfiles.d/hyzorax-control.conf
          sudo systemctl daemon-reload
          sudo systemctl start hyzorax-control-helper.service
          sudo systemctl is-active --quiet hyzorax-control-helper.service
          for attempt in {1..50}; do
            test -S /run/hyzorax-control/helper.sock && break
            sleep 0.1
          done
          test -S /run/hyzorax-control/helper.sock
          main_pid="$(sudo systemctl show hyzorax-control-helper.service -p MainPID --value)"
          test "$main_pid" -gt 1
          sudo grep -Eq '^NoNewPrivs:[[:space:]]+0$' "/proc/$main_pid/status"
          families="$(sudo systemctl show hyzorax-control-helper.service -p RestrictAddressFamilies --value)"
          for family in AF_UNIX AF_NETLINK AF_INET AF_INET6; do
            grep -qw "$family" <<<"$families"
          done
          go test -c -tags=integration -o /tmp/hyzorax-helper-integration.test ./internal/helper
          chmod 0755 /tmp/hyzorax-helper-integration.test
          sudo -u hyzorax-control env HYZORAX_SYSTEMD_INSTALLER_ACCEPTANCE=1 HYZORAX_SYSTEMD_HELPER_SOCKET=/run/hyzorax-control/helper.sock /tmp/hyzorax-helper-integration.test -test.run '^TestFail2banInstallerSystemdServiceAcceptance$' -test.v
          sudo systemctl is-active --quiet hyzorax-control-helper.service
          sudo systemctl stop hyzorax-control-helper.service
          trap - ERR
          (cd /tmp/v179 && sha256sum -c base-hz.sha256)
