name: Build and release V1.6.9 UI refinement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v169:
    if: github.event.pull_request.head.ref == 'agent/v1.6.9-ui-refine'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.6.8 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.6.8 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          sha256sum work/hyzorax-control/internal/httpapi/applications.go | awk '{print $1}' > /tmp/apps-api-before.sha
          sha256sum work/hyzorax-control/internal/helper/protocol.go | awk '{print $1}' > /tmp/protocol-before.sha
          grep -q 'const ProtocolVersion = 17' work/hyzorax-control/internal/helper/protocol.go

      - name: Apply V1.6.9 UI refinement
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.6.9/ui_refine.py release-patch/v1.6.9/post_refine.py
          python3 release-patch/v1.6.9/ui_refine.py work/hyzorax-control
          python3 release-patch/v1.6.9/post_refine.py work/hyzorax-control

      - name: Static and scope checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          test "$(sha256sum internal/httpapi/applications.go | awk '{print $1}')" = "$(cat /tmp/apps-api-before.sha)"
          test "$(sha256sum internal/helper/protocol.go | awk '{print $1}')" = "$(cat /tmp/protocol-before.sha)"
          grep -q 'Version 1.6.9' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 17' internal/helper/protocol.go
          grep -q 'id="applications-search"' internal/web/static/index.html
          grep -q 'class="software-list"' internal/web/static/index.html
          grep -q 'data-app-filter="installed"' internal/web/static/index.html
          grep -q 'id="editor-window-bar"\|class="editor-window-bar"' internal/web/static/index.html
          grep -q 'id="editor-tree-path"' internal/web/static/index.html
          grep -q 'id="editor-tree-up"' internal/web/static/index.html
          grep -q 'id="editor-save-button"' internal/web/static/index.html
          grep -q 'function loadEditorDirectory' internal/web/static/app.js
          grep -q 'loadEditorDirectory(editorParentDirectory(state.editorTreePath))' internal/web/static/app.js
          grep -q 'function closeEditorWindow' internal/web/static/app.js
          grep -q 'applyApplicationFilters' internal/web/static/app.js
          grep -q 'background:#0f1822' internal/web/static/app.css
          if grep -q 'loadEditorTreeRoot' internal/web/static/app.js; then echo 'legacy root-wide editor tree is still present' >&2; exit 1; fi
          if grep -q '<div class="application-grid">' internal/web/static/index.html; then echo 'legacy Applications card grid is still present' >&2; exit 1; fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build and verify V1.6.9
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.6.9
          ./build/hyzorax-control -version | grep -q '1.6.9'
          ./build/hyzorax-control-helper -version | grep -q '1.6.9'
          grep -q 'const ProtocolVersion = 17' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.6.9 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.6.9 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.9 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.6.9' \
            --notes 'V1.6.9 is a focused UI/UX refinement. Applications is now a compact searchable software manager with All, Installed, Available and Needs attention filters while keeping the existing guarded Node.js 24 LTS and Composer installer backend unchanged. The text editor is rebuilt as a near-full-screen server editing workspace with a compact command bar, dark editing surface, status bar, current-directory explorer with Up/Refresh navigation, multi-tab support, guarded unsaved-close confirmation, and the existing Find/Replace and Ctrl+S workflows. aaPanel screenshots were used only as product-reference inspiration; HYZoraX keeps its own visual language and implementation. Helper protocol stays V17 and hz is unchanged.' \
            --latest
