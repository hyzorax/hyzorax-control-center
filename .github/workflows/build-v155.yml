name: Build and release V1.5.5 File Manager

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v155:
    if: github.event.pull_request.head.ref == 'agent/v1.5.5-filemanager-metadata-notifications'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.5.4 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.4 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control

      - name: Apply V1.5.5
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.5.5/apply.py
          python3 release-patch/v1.5.5/apply.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/helper/protocol.go internal/helper/server_linux.go internal/helper/filesystem_linux.go internal/helper/filesystem_linux_test.go internal/httpapi/app.go internal/httpapi/handlers.go internal/web/assets_test.go internal/httpapi/app_test.go

      - name: Static and security checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hyzorax-control-tls
          bash -n packaging/hyzorax-control-updater
          bash -n packaging/hz
          grep -q 'Version 1.5.5' internal/web/static/index.html
          grep -q 'const ProtocolVersion = 10' internal/helper/protocol.go
          grep -q 'filesystem.metadata.update' internal/helper/server_linux.go
          grep -q 'POST /api/v1/files/metadata' internal/httpapi/app.go
          grep -q 'id="metadata-dialog"' internal/web/static/index.html
          grep -q 'id="toast-host"' internal/web/static/index.html
          grep -q 'openMetadata' internal/web/static/app.js
          grep -q 'showToast' internal/web/static/app.js
          grep -q 'permission-grid' internal/web/static/app.css
          grep -q 'showPanelConfirmation' internal/web/static/app.js
          if grep -q 'window.confirm(' internal/web/static/app.js; then
            echo 'Native browser confirm regressed' >&2
            exit 1
          fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build and verify V1.5.5
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.5.5
          ./build/hyzorax-control -version | grep -q '1.5.5'
          ./build/hyzorax-control-helper -version | grep -q '1.5.5'
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.5.5 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.5.5 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.5.5 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.5.5' \
            --notes 'File Manager metadata and feedback release. Adds guarded Properties controls for ordinary rwx permissions plus owner/group changes on regular files and folders. Root, symlinks, special files and mount-boundary items remain blocked. Adds panel-native success notifications for common file operations. Keeps all confirmations panel-native and retains the V1.5.4 editor/image/recycle-bin polish. Helper protocol V10.' \
            --latest
