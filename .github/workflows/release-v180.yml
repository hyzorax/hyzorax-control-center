name: Validate and publish V1.8.0

on:
  pull_request:
    branches:
      - main
    paths:
      - "release-patch/v1.8.0/**"
      - ".github/workflows/release-v180.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified V1.8.0 GitHub release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: v1.8.0-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: "1.8.0"
  BASE_TAG: "v1.7.9"
  BASE_ARCHIVE: "HYZoraX_Control_Center_Linux_x86_64.tar.gz"
  BASE_SHA256: "1bc85433f3a560fad152cd2cfb3fe0a1c97ab2eccc4879fb7ea2ce74c71003aa"
  PATCH_FILE: "release-patch/v1.8.0/software_ui.py"
  PATCH_SHA256: "f91898e508f5f4000316f81fdb39bed9aee7e8131926e6f543ac227892634005"
  INDEX_SHA256: "b70b0863ed1070cccfc918d5d918af3cdb25903f1c3d515271c3abfb9a7ce1ba"
  CSS_SHA256: "b6d6e86e2cb372a676ce97cf98cbb6610ccb2fd0ae47a17d42cdd2c71d723e04"
  JS_SHA256: "dde412648367d8dae2808c2dac6540998eec67c884537ce0135f69ab08291f95"
  HZ_SHA256: "7ecc6c68e5507007424ca263fa0ee4b1ece25aae9c60257fb283d6cc62cd21b5"

jobs:
  validate-build-publish:
    name: Reconstruct, validate, build, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Download and authenticate V1.7.9 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf -- _release-work
          mkdir -p _release-work/base
          gh release download "$BASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir _release-work \
            --pattern "$BASE_ARCHIVE" \
            --pattern "$BASE_ARCHIVE.sha256"
          echo "$BASE_SHA256  _release-work/$BASE_ARCHIVE" | sha256sum -c -
          (cd _release-work && sha256sum -c "$BASE_ARCHIVE.sha256")
          tar -xzf "_release-work/$BASE_ARCHIVE" -C _release-work/base
          source_dir="$(find _release-work/base -type f -name go.mod -printf '%h\n' -quit)"
          test -n "$source_dir"
          printf '%s\n' "$source_dir" > _release-work/source-path
          grep -F "Version 1.7.9" "$source_dir/internal/web/static/index.html"
          grep -F "const ProtocolVersion = 21" "$source_dir/internal/helper/protocol.go"

      - name: Authenticate and apply V1.8.0 patch
        run: |
          set -Eeuo pipefail
          echo "$PATCH_SHA256  $PATCH_FILE" | sha256sum -c -
          python3 -m py_compile "$PATCH_FILE"
          source_dir="$(cat _release-work/source-path)"
          python3 "$PATCH_FILE" "$source_dir"

      - name: Verify release invariants
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          echo "$INDEX_SHA256  $source_dir/internal/web/static/index.html" | sha256sum -c -
          echo "$CSS_SHA256  $source_dir/internal/web/static/app.css" | sha256sum -c -
          echo "$JS_SHA256  $source_dir/internal/web/static/app.js" | sha256sum -c -
          echo "$HZ_SHA256  $source_dir/packaging/hz" | sha256sum -c -
          grep -F "Version 1.8.0" "$source_dir/internal/web/static/index.html"
          grep -F "Desktop management console" "$source_dir/internal/web/static/app.css"
          grep -F -- "--sidebar:#111c2e" "$source_dir/internal/web/static/app.css"
          grep -F "class=\"nav-icon\"" "$source_dir/internal/web/static/index.html"
          grep -F "const ProtocolVersion = 21" "$source_dir/internal/helper/protocol.go"
          grep -F 'headers.set("Content-Type", "application/json")' "$source_dir/internal/web/static/app.js"
          test "$(grep -o 'id=\"[^\"]*\"' "$source_dir/internal/web/static/index.html" | sort | uniq -d | wc -l)" -eq 0

      - name: Run static checks
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          node --check internal/web/static/app.js
          bash -n \
            packaging/bootstrap.sh \
            packaging/hyzorax-control-tls \
            packaging/hyzorax-control-updater \
            packaging/hyzorax-dashboard \
            packaging/hz

      - name: Run Go tests, race checks, and vet
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          go test ./...
          go test -race ./internal/config ./internal/cryptoutil ./internal/helper ./internal/httpapi ./internal/installer ./internal/store ./internal/web
          go vet ./...

      - name: Build authenticated V1.8.0 bundle
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          cd "$source_dir"
          make clean
          make release VERSION="$VERSION"
          test "$(./build/hyzorax-control -version)" = "hyzorax-control $VERSION"
          test "$(./build/hyzorax-control-helper -version)" = "hyzorax-control-helper $VERSION"
          (cd build && sha256sum --check --strict SHA256SUMS)

      - name: Package release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -Eeuo pipefail
          source_dir="$(cat _release-work/source-path)"
          mkdir -p _release-work/package/hyzorax-control
          cp -a "$source_dir/build/." _release-work/package/hyzorax-control/
          tar -C _release-work/package -czf "_release-work/$BASE_ARCHIVE" hyzorax-control
          (cd _release-work && sha256sum "$BASE_ARCHIVE" > "$BASE_ARCHIVE.sha256")
          (cd _release-work && sha256sum -c "$BASE_ARCHIVE.sha256")

      - name: Publish public V1.8.0 release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            "_release-work/$BASE_ARCHIVE" \
            "_release-work/$BASE_ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HYZoraX Control Center V1.8.0" \
            --notes "V1.8.0 converts the complete HYZoraX Control Center into a cohesive desktop software interface while retaining Protocol V21, updater behavior, security controls, installer safeguards, and the hz launcher. The Linux x86_64 archive was reconstructed from the authenticated V1.7.9 release, patched, fully tested, and rebuilt in this workflow."

      - name: Verify published release and assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p _release-work/published
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir _release-work/published \
            --pattern "$BASE_ARCHIVE" \
            --pattern "$BASE_ARCHIVE.sha256"
          (cd _release-work/published && sha256sum -c "$BASE_ARCHIVE.sha256")
          gh release view "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,url
