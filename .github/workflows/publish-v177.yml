name: Publish V1.7.7
on:
  pull_request:
    branches: [main]
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  publish-v177:
    if: github.head_ref == 'agent/v1.7.7-release-finalizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download exact V1.7.6 release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v177
          gh release download v1.7.6 --repo "$GITHUB_REPOSITORY" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz*' --dir /tmp/v177
          cd /tmp/v177
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz
          grep -q 'Version 1.7.6' hyzorax-control/internal/web/static/index.html
          sha256sum hyzorax-control/packaging/hz > base-hz.sha256
      - name: Apply validated V1.7.7 hotfix
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.7.7/installer_deadline_hotfix.py
          python3 release-patch/v1.7.7/installer_deadline_hotfix.py /tmp/v177/hyzorax-control
      - name: Test and vet release source
        working-directory: /tmp/v177/hyzorax-control
        run: |
          set -Eeuo pipefail
          grep -q 'const ProtocolVersion = 21' internal/helper/protocol.go
          grep -q 'Version 1.7.7' internal/web/static/index.html
          grep -q 'conn.SetDeadline(helperConnectionDeadline' internal/helper/server_linux.go
          grep -q 'helperActionTimeout(request.Action)' internal/helper/server_linux.go
          grep -q 'extendApplicationInstallWriteDeadline' internal/httpapi/applications.go
          grep -q 'http.NewResponseController' internal/httpapi/applications.go
          grep -q 'applicationInstallTimeout = 12 \* time.Minute' internal/httpapi/applications.go
          grep -q 'Installing Ubuntu packages' internal/web/static/app.js
          grep -q 'v177-transport' internal/helper/installer_fail2ban_acceptance_test.go
          (cd /tmp/v177 && sha256sum -c base-hz.sha256)
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh packaging/hyzorax-control-updater packaging/hz
          go test ./...
          go test -tags=integration ./internal/helper
          go test -race ./internal/helper ./internal/httpapi
          go vet ./...
      - name: Real Fail2ban socket-transport acceptance
        working-directory: /tmp/v177/hyzorax-control
        run: |
          set -Eeuo pipefail
          sudo env PATH="$PATH" HYZORAX_INSTALLER_ACCEPTANCE=1 \
            go test -count=1 -tags=integration -run '^TestFail2banInstallerAcceptance$' -v ./internal/helper
      - name: Build release package
        working-directory: /tmp/v177/hyzorax-control
        run: |
          set -Eeuo pipefail
          mkdir -p build
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.7' -o build/hyzorax-control ./cmd/hyzorax-control
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.7' -o build/hyzorax-control-helper ./cmd/hyzorax-control-helper
          cp \
            packaging/config.toml \
            packaging/hyzorax-control.service \
            packaging/hyzorax-control-helper.service \
            packaging/hyzorax-control-tls-renew.service \
            packaging/hyzorax-control-tls-renew.timer \
            packaging/hyzorax-control.tmpfiles.conf \
            packaging/bootstrap.sh \
            packaging/hyzorax-control-tls \
            packaging/hyzorax-control-updater \
            packaging/hyzorax-dashboard \
            packaging/hz \
            build/
          chmod 0755 build/bootstrap.sh build/hyzorax-control-tls build/hyzorax-control-updater build/hyzorax-dashboard build/hz
          files=(
            hyzorax-control
            hyzorax-control-helper
            config.toml
            hyzorax-control.service
            hyzorax-control-helper.service
            hyzorax-control-tls-renew.service
            hyzorax-control-tls-renew.timer
            hyzorax-control.tmpfiles.conf
            bootstrap.sh
            hyzorax-control-tls
            hyzorax-control-updater
            hyzorax-dashboard
            hz
          )
          for f in "${files[@]}"; do
            test -f "build/$f" || { echo "Missing release file: $f" >&2; ls -la build; exit 1; }
          done
          (
            cd build
            sha256sum "${files[@]}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          test "$(build/hyzorax-control -version | awk '{print $NF}')" = '1.7.7'
          test "$(build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.7'
          grep -q 'RestrictAddressFamilies=AF_UNIX AF_NETLINK' build/hyzorax-control-helper.service
          cd /tmp/v177
          rm -f HYZoraX_Control_Center_Linux_x86_64.tar.gz HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          rm -rf /tmp/v177/verify
          mkdir /tmp/v177/verify
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C /tmp/v177/verify
          test -x /tmp/v177/verify/hyzorax-control/build/hyzorax-control
          test -x /tmp/v177/verify/hyzorax-control/build/hyzorax-control-helper
          test "$(/tmp/v177/verify/hyzorax-control/build/hyzorax-control -version | awk '{print $NF}')" = '1.7.7'
          test "$(/tmp/v177/verify/hyzorax-control/build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.7'
          grep -q 'Version 1.7.7' /tmp/v177/verify/hyzorax-control/internal/web/static/index.html
          grep -q 'const ProtocolVersion = 21' /tmp/v177/verify/hyzorax-control/internal/helper/protocol.go
          grep -q 'conn.SetDeadline(helperConnectionDeadline' /tmp/v177/verify/hyzorax-control/internal/helper/server_linux.go
          (cd /tmp/v177/verify/hyzorax-control/build && sha256sum --check --strict SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view v1.7.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.7.7 already exists; refusing duplicate publish.' >&2
            exit 1
          fi
          gh release create v1.7.7 \
            /tmp/v177/HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            /tmp/v177/HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target ddcc5da6610ee471ce234aa691cf27e397493883 \
            --title 'HYZoraX Control Panel V1.7.7' \
            --notes 'Fixes guarded application installations that could lose their browser/helper response before Ubuntu package work completed. Installer requests now receive a bounded 12-minute transport window on both the panel HTTP response and privileged helper Unix socket, while normal actions retain short deadlines. Applications now show clear multi-minute progress guidance and visible failure messages. A real Ubuntu 24.04 Fail2ban install, health, managed-policy, unban, and rollback flow is validated through the same socket transport. Helper protocol remains V21 and the hz main menu remains unchanged.' \
            --latest
      - name: Verify published latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          test "$latest" = 'v1.7.7'
          target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.7.7" --jq .target_commitish)"
          test "$target" = 'ddcc5da6610ee471ce234aa691cf27e397493883'
          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.7.7" --jq '[.assets[].name] | sort | join("\n")')"
          test "$assets" = $'HYZoraX_Control_Center_Linux_x86_64.tar.gz\nHYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256'
          rm -rf /tmp/v177/published
          mkdir -p /tmp/v177/published
          gh release download v1.7.7 --repo "$GITHUB_REPOSITORY" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz*' --dir /tmp/v177/published
          cd /tmp/v177/published
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz
          test "$(hyzorax-control/build/hyzorax-control -version | awk '{print $NF}')" = '1.7.7'
          test "$(hyzorax-control/build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.7'
          grep -q 'Version 1.7.7' hyzorax-control/internal/web/static/index.html
          grep -q 'const ProtocolVersion = 21' hyzorax-control/internal/helper/protocol.go
          grep -q 'conn.SetDeadline(helperConnectionDeadline' hyzorax-control/internal/helper/server_linux.go
          grep -q 'extendApplicationInstallWriteDeadline' hyzorax-control/internal/httpapi/applications.go
          (cd hyzorax-control/build && sha256sum --check --strict SHA256SUMS)
