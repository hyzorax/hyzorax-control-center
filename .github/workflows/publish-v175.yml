name: Publish V1.7.5
on:
  pull_request:
    branches: [main]
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  publish-v175:
    if: github.head_ref == 'agent/v1.7.5-release-finalizer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Download exact V1.7.4 release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v175
          gh release download v1.7.4 --repo "$GITHUB_REPOSITORY" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz*' --dir /tmp/v175
          cd /tmp/v175
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz
      - name: Apply validated V1.7.5 patch
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.7.5/fail2ban_management.py
          python3 release-patch/v1.7.5/fail2ban_management.py /tmp/v175/hyzorax-control
      - name: Test and vet release source
        working-directory: /tmp/v175/hyzorax-control
        run: |
          set -Eeuo pipefail
          grep -q 'const ProtocolVersion = 21' internal/helper/protocol.go
          grep -q 'Version 1.7.5' internal/web/static/index.html
          grep -q 'security.fail2ban.apply' internal/helper/server_linux.go
          grep -q 'security/fail2ban/apply' internal/httpapi/app.go
          grep -q 'RestrictAddressFamilies=AF_UNIX AF_NETLINK' packaging/hyzorax-control-helper.service
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh packaging/hyzorax-control-updater packaging/hz
          go test ./...
          go vet ./...
      - name: Build release package
        working-directory: /tmp/v175/hyzorax-control
        run: |
          set -Eeuo pipefail
          mkdir -p build
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.5' -o build/hyzorax-control ./cmd/hyzorax-control
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -X main.version=1.7.5' -o build/hyzorax-control-helper ./cmd/hyzorax-control-helper
          cp \
            packaging/config.toml \
            packaging/hyzorax-control.service \
            packaging/hyzorax-control-helper.service \
            packaging/hyzorax-control-tls-renew.service \
            packaging/hyzorax-control-tls-renew.timer \
            packaging/hyzorax-control.tmpfiles.conf \
            packaging/bootstrap.sh \
            packaging/hyzorax-control-tls \
            packaging/hyzorax-control-updater \
            packaging/hyzorax-dashboard \
            packaging/hz \
            build/
          chmod 0755 build/bootstrap.sh build/hyzorax-control-tls build/hyzorax-control-updater build/hyzorax-dashboard build/hz
          files=(
            hyzorax-control
            hyzorax-control-helper
            config.toml
            hyzorax-control.service
            hyzorax-control-helper.service
            hyzorax-control-tls-renew.service
            hyzorax-control-tls-renew.timer
            hyzorax-control.tmpfiles.conf
            bootstrap.sh
            hyzorax-control-tls
            hyzorax-control-updater
            hyzorax-dashboard
            hz
          )
          for f in "${files[@]}"; do
            test -f "build/$f" || { echo "Missing release file: $f" >&2; ls -la build; exit 1; }
          done
          (
            cd build
            sha256sum "${files[@]}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          test "$(build/hyzorax-control -version | awk '{print $NF}')" = '1.7.5'
          test "$(build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.5'
          grep -q 'RestrictAddressFamilies=AF_UNIX AF_NETLINK' build/hyzorax-control-helper.service
          cd /tmp/v175
          rm -f HYZoraX_Control_Center_Linux_x86_64.tar.gz HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          rm -rf verify
          mkdir verify
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C verify
          test -x verify/hyzorax-control/build/hyzorax-control
          test -x verify/hyzorax-control/build/hyzorax-control-helper
          test "$(verify/hyzorax-control/build/hyzorax-control -version | awk '{print $NF}')" = '1.7.5'
          test "$(verify/hyzorax-control/build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.5'
          grep -q 'Version 1.7.5' verify/hyzorax-control/internal/web/static/index.html
          grep -q 'const ProtocolVersion = 21' verify/hyzorax-control/internal/helper/protocol.go
          (cd verify/hyzorax-control/build && sha256sum --check --strict SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view v1.7.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.7.5 already exists; refusing duplicate publish.' >&2
            exit 1
          fi
          gh release create v1.7.5 \
            /tmp/v175/HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            /tmp/v175/HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target 5633315a19aa078cfdd490b563085450d5d9d025 \
            --title 'HYZoraX Control Panel V1.7.5' \
            --notes 'Adds guarded Fail2ban management to the Security page. Operators can inspect active SSH jail policy and bounded banned-IP data, safely unban a currently banned IPv4 or IPv6 address, and update HYZoraX-owned maxretry/findtime/bantime policy within strict limits. Policy writes are atomic, validated by Fail2ban, restarted with bounded readiness verification, and automatically rolled back on failure. Existing non-HYZoraX jail policies remain read-only. Helper protocol is now V21.' \
            --latest
      - name: Verify published latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          test "$latest" = 'v1.7.5'
          rm -rf /tmp/v175/published
          mkdir -p /tmp/v175/published
          gh release download v1.7.5 --repo "$GITHUB_REPOSITORY" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz*' --dir /tmp/v175/published
          cd /tmp/v175/published
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          tar -xzf HYZoraX_Control_Center_Linux_x86_64.tar.gz
          test "$(hyzorax-control/build/hyzorax-control -version | awk '{print $NF}')" = '1.7.5'
          test "$(hyzorax-control/build/hyzorax-control-helper -version 2>&1 | awk '{print $NF}')" = '1.7.5'
          (cd hyzorax-control/build && sha256sum --check --strict SHA256SUMS)
