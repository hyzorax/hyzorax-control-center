name: Build and release V1.7.0 Security Center foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-v170:
    if: github.event.pull_request.head.ref == 'agent/v1.7.0-security-center-readonly'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false

      - name: Download V1.6.10 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf work
          mkdir -p work
          gh release download v1.6.10 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
          sha256sum work/hyzorax-control/packaging/hz | awk '{print $1}' > /tmp/hz-before.sha
          grep -q 'const ProtocolVersion = 17' work/hyzorax-control/internal/helper/protocol.go
          grep -q 'Version 1.6.10' work/hyzorax-control/internal/web/static/index.html

      - name: Apply V1.7.0 Security Center
        run: |
          set -Eeuo pipefail
          python3 -m py_compile release-patch/v1.7.0/security_center.py
          python3 release-patch/v1.7.0/security_center.py work/hyzorax-control
          cd work/hyzorax-control
          gofmt -w internal/helper/protocol.go internal/helper/server_linux.go internal/helper/security_linux.go internal/helper/security_linux_test.go internal/httpapi/app.go internal/httpapi/security.go internal/httpapi/app_test.go internal/web/assets_test.go

      - name: Static security and UI checks
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          node --check internal/web/static/app.js
          bash -n packaging/bootstrap.sh
          bash -n packaging/hz
          test "$(sha256sum packaging/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          grep -q 'const ProtocolVersion = 18' internal/helper/protocol.go
          grep -q 'case "security.summary"' internal/helper/server_linux.go
          grep -q 'request.Target != "" || len(request.Params) != 0' internal/helper/server_linux.go
          grep -q 'GET /api/v1/security/summary' internal/httpapi/app.go
          grep -q 'Action:[[:space:]]*"security.summary"' internal/httpapi/security.go
          grep -q 'data-view="security"' internal/web/static/index.html
          grep -q 'id="security-view"' internal/web/static/index.html
          grep -q 'Security posture' internal/web/static/index.html
          grep -q 'Listening ports' internal/web/static/index.html
          grep -q 'api/v1/security/summary' internal/web/static/app.js
          grep -q 'Version 1.7.0' internal/web/static/index.html
          grep -q 'href="#services"><span>◉</span>Services <em>Soon</em>' internal/web/static/index.html
          grep -q 'href="#databases"><span>▥</span>Databases <em>Soon</em>' internal/web/static/index.html
          if grep -Rni -E 'bash -c|sh -c|/bin/bash|/bin/sh' internal/helper/security_linux.go internal/httpapi/security.go; then
            echo 'Security Center must not introduce shell-command execution.' >&2
            exit 1
          fi
          if grep -Rni -E 'ufw.*(enable|disable|allow|deny|delete)|nft.*(add|delete|flush)|sshd.*(-t.*-f|-f)|systemctl.*(start|stop|restart|enable|disable)' internal/helper/security_linux.go; then
            echo 'V1.7.0 Security Center foundation must remain read-only.' >&2
            exit 1
          fi

      - name: Test and vet
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          go test ./...
          go vet ./...

      - name: Build and verify V1.7.0
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          make clean
          make release VERSION=1.7.0
          ./build/hyzorax-control -version | grep -q '1.7.0'
          ./build/hyzorax-control-helper -version | grep -q '1.7.0'
          grep -q 'const ProtocolVersion = 18' internal/helper/protocol.go
          test "$(sha256sum build/hz | awk '{print $1}')" = "$(cat /tmp/hz-before.sha)"
          (cd build && sha256sum -c SHA256SUMS)

      - name: Package release assets
        run: |
          set -Eeuo pipefail
          tar -czf HYZoraX_Control_Center_Linux_x86_64.tar.gz -C work hyzorax-control
          sha256sum HYZoraX_Control_Center_Linux_x86_64.tar.gz > HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256
          sha256sum -c HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256

      - name: Publish V1.7.0 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release delete v1.7.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.7.0 \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz \
            HYZoraX_Control_Center_Linux_x86_64.tar.gz.sha256 \
            --title 'HYZoraX Control Panel V1.7.0' \
            --notes 'V1.7.0 starts P7 Security Center with a guarded read-only foundation. The Security sidebar is now active and shows effective OpenSSH posture, host firewall visibility for UFW/nftables, generic Fail2ban/sshd-jail visibility, and a bounded TCP/UDP listening-port inventory with Public, Local only and Bound address scope. The browser endpoint is authenticated and backed by a fixed typed helper action security.summary; it accepts no target or arbitrary parameters and does not expose firewall, SSH or service mutations. Helper protocol advances to V18. Services and Databases remain Soon and the hz menu is unchanged.' \
            --latest
