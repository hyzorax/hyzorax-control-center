name: Inspect V1.5.7 source for V1.5.8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/v1.5.8-hz-username-lastlog'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download V1.5.7 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p work
          gh release download v1.5.7 --repo "${GITHUB_REPOSITORY}" --pattern 'HYZoraX_Control_Center_Linux_x86_64.tar.gz' --output /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C work
          test -d work/hyzorax-control
      - name: Inspect hz and SSH/MOTD setup
        run: |
          set -Eeuo pipefail
          cd work/hyzorax-control
          echo '===== packaging/hz username/detail ====='
          grep -n -C 8 -E 'Username:|Password:|Show panel Detail|show_panel|owner-username' packaging/hz || true
          echo '===== bootstrap ssh/motd ====='
          grep -n -C 8 -E 'motd|pam_motd|sshd_config|PrintLastLog|hyzorax-dashboard' packaging/bootstrap.sh || true
          echo '===== main owner username flag ====='
          grep -n -C 5 -E 'owner-username|printOwnerUsername|configuredOwnerUsername' cmd/hyzorax-control/main.go || true
